          pay = { pending: 'Δεν έχει χρεωθεί τίποτα', confirmed: 'Η πληρωμή κανονίζεται απευθείας με τον πελάτη', cancelled: 'Ακυρώθηκε', rejected: b.expired ? 'Έληξε χωρίς απάντηση' : 'Απορρίφθηκε' }[b.status];
        } else if (b.source === 'site') {
          pay = { pending: 'Δεσμευμένα, όχι χρεωμένα', confirmed: auto ? 'Πληρώθηκε με κάρτα στην κράτηση' : 'Χρεώθηκαν μέσω Stripe', cancelled: 'Επιστράφηκαν στην κάρτα', rejected: b.expired ? 'Η δέσμευση λύθηκε αυτόματα, χωρίς χρέωση' : 'Η δέσμευση λύθηκε' }[b.status];
        }
        const canMove = !b.synced && b.status === 'confirmed' && b.type === 'room' && !!b.unit && (auto || b.source === 'site' || b.source === 'direct' || !!b.stayId);
        const moveIds = canMove ? this.candidates(b).filter(u => u.id !== b.unit && this.isFree(u.id, b.start, b.nights, b.id)).map(u => u.id) : [];
        detail = Object.assign({
          name: b.name,
          sourceText: b.source === 'site' ? 'Κράτηση από το σάιτ' : (b.source === 'direct' ? 'Την πέρασες εσύ' + (b.note ? ' · ' + b.note : '') : 'Κράτηση από Booking.com'),
          dates: this.range(b.start, this.endOf(b)),
          nightsGuests: b.synced ? b.nights + (b.nights === 1 ? ' νύχτα' : ' νύχτες') + ' · τα άτομα φαίνονται στο Booking' : b.nights + ' νύχτες · ' + b.guests + ' άτομα',
          unit: b.unit ? this.unitName(b.unit) : (b.type === 'apt' ? 'Διαμέρισμα' : 'Δωμάτιο, όχι ακόμα'),
          total: this.money(b.total), pay: pay, email: b.email || '–', phone: b.phone || '–',
          hasBy: !!b.by, by: b.by || '',
          canCancel: !b.synced && (b.source === 'site' || b.source === 'direct' || !!b.stayId) && b.status === 'confirmed',
          canDelete: !b.synced, syncedNoDelete: !!b.synced,
          remove: () => this.deleteBooking(b),
          cancelLabel: b.source === 'direct' || this.REAL ? 'Ακύρωση κράτησης' : 'Ακύρωση με επιστροφή χρημάτων',
          isBooking: b.source === 'booking',
          canMessage: b.source === 'site' && s.tab !== 'msgs',
          panelClose: s.tab !== 'msgs' && !inlineDetail, inline: inlineDetail, extras: s.tab !== 'msgs',
          isPending: b.status === 'pending',
          canMove: canMove, noMoves: canMove && moveIds.length === 0,
          moves: moveIds.map(id => ({ label: this.unitName(id), style: chipOff, pick: () => {
            if (b.real) { this.saveReal(b, { unit: id }, () => this.say(b.name + ' μεταφέρθηκε στο ' + this.unitName(id) + '.')); return; }
            this.patch(b.id, { unit: id });
            this.say(b.name + ' μεταφέρθηκε στο ' + this.unitName(id) + '.' + (auto ? ' Ενημερώθηκε και το Beds24.' : ''));
          } })),
          answer: () => this.openReq(b.id),
          hasGuest: !b.synced,
          openGuest: () => this.openGuest(b.name),
          close: () => this.setState({ detail: null }),
          message: () => this.openThread(b.id),
          cancel: () => {
            if (b.real) {
              const mails = b.source === 'site' && b.kind !== 'test' && !!b.email;
              if (!confirm('Ακύρωση της κράτησης του/της ' + b.name + ' (' + this.range(b.start, this.endOf(b)) + ');' + (mails ? '\n\nΟ πελάτης θα πάρει αυτόματα email ότι ακυρώθηκε και ότι θα βρείτε μαζί λύση.' : ''))) return;
              this.saveReal(b, { status: 'cancelled', decided_by: this.who('Ακύρωση') }, () => this.say('Ακυρώθηκε η κράτηση του/της ' + b.name + '. Οι μέρες άνοιξαν ξανά στο σάιτ.' + (mails ? ' Στάλθηκε email στον πελάτη.' : '')));
              return;
            }
            this.patch(b.id, { status: 'cancelled', by: this.who('Ακύρωση') });
            if (b.source === 'direct') { this.say('Ακυρώθηκε η κράτηση του/της ' + b.name + '. Το δωμάτιο ελευθερώθηκε και στο Booking.'); return; }
            this.say('Ακυρώθηκε · επιστροφή ' + this.money(b.total) + ' στην κάρτα. Το δωμάτιο ελευθερώθηκε και στο Booking.');
          }
        }, this.badgeFor(b));
      }
    }

    /* Guests */
    const gmap = {};
    const addG = name => gmap[name] || (gmap[name] = { name: name, email: '', phone: '', sources: {}, stays: [], spent: 0, count: 0, current: null, next: null, last: null, pending: false });
    this.PAST.forEach(p => {
      const g = addG(p.name);
      if (!g.email && p.email) { g.email = p.email; g.phone = p.phone; }
      g.sources[p.source] = 1;
      g.stays.push({ key: p.date, when: p.when, what: p.unit + ' · ' + p.nights + ' νύχτες', money: p.total, status: 'Ολοκληρώθηκε', id: null });
      g.spent += p.total; g.count++;
      if (!g.last || p.date > g.last) g.last = p.date;
    });
    B.forEach(b => {
      if (b.status === 'rejected' || b.status === 'pending' || b.kind === 'test' || b.synced) return;
      const g = addG(b.name);
      g.email = b.email; g.phone = b.phone;
      g.sources[b.source] = 1;
      const end = this.endOf(b);
      let status = 'Επιβεβαιωμένη';
      if (b.status === 'pending') { status = 'Αίτημα'; g.pending = true; }
      else if (b.status === 'cancelled') status = 'Ακυρώθηκε';
      else if (b.start <= T && T < end) { status = 'Μένει τώρα'; g.current = b; }
      else if (end <= T) { status = 'Ολοκληρώθηκε'; if (!g.last || end > g.last) g.last = end; }
      else { status = 'Έρχεται'; if (!g.next || b.start < g.next.start) g.next = b; }
      if (b.status === 'confirmed') { g.spent += b.total; g.count++; }
      g.stays.push({ key: b.start, when: this.range(b.start, end) + ' ' + b.start.slice(0, 4), what: (b.unit ? this.unitName(b.unit) : (b.type === 'apt' ? 'Διαμέρισμα' : 'Δωμάτιο')) + ' · ' + b.nights + ' νύχτες', money: b.total, status: status, id: b.id });
    });
    const MONY = s2 => { const d = this.dt(s2); return this.MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
    const srcLabel = g => ['site', 'booking', 'direct'].filter(k => g.sources[k]).map(k => ({ site: 'Σάιτ', booking: 'Booking', direct: 'Από εμάς' })[k]).join(' και ');
    const rank = g => g.current ? 0 : (g.next ? 1 : (g.pending ? 2 : 3));
    const gq = (s.gQuery || '').trim().toLowerCase();
    const gDefs = [
      { id: 'all', label: 'Όλοι', fn: () => true },
      { id: 'here', label: 'Μένουν τώρα', fn: g => !!g.current },
      { id: 'back', label: 'Επιστρέφουν', fn: g => g.count >= 2 },
      { id: 'site', label: 'Από το σάιτ', fn: g => !!g.sources.site },
      { id: 'direct', label: 'Από εμάς', fn: g => !!g.sources.direct }
    ];
    const allG = Object.keys(gmap).map(k => gmap[k]);
    const gFilters = gDefs.map(f => ({ label: f.label + ' · ' + allG.filter(f.fn).length, style: f.id === s.gFilter ? chipOn : chipOff, pick: () => this.setState({ gFilter: f.id }) }));
    const gfn = (gDefs.find(f => f.id === s.gFilter) || gDefs[0]).fn;
    const guests = allG
      .filter(g => !gq || (g.name + ' ' + g.email + ' ' + g.phone).toLowerCase().indexOf(gq) !== -1)
      .sort((a, c) => rank(a) - rank(c) || (a.next && c.next ? (a.next.start < c.next.start ? -1 : 1) : 0) || (c.last || '').localeCompare(a.last || '') || a.name.localeCompare(c.name, 'el'))
      .map(g => {
        let whenText = '', whenColor = '#2E4448';
        if (g.current) { whenText = 'Μένει τώρα · ως ' + this.fmt(this.endOf(g.current)); whenColor = '#0F5257'; }
        else if (g.next) { whenText = 'Έρχεται ' + this.fmt(g.next.start); whenColor = '#1E3A5F'; }
        else if (g.pending) { whenText = 'Αίτημα σε αναμονή'; whenColor = '#7A4708'; }
        else if (g.last) whenText = 'Τελευταία ' + MONY(g.last);
        return {
          name: g.name, email: g.email || '–', phone: g.phone || '–', contact: [g.email, g.phone].filter(Boolean).join(' · ') || 'Χωρίς στοιχεία επικοινωνίας',
          returning: g.count >= 2,
          staysText: g.count + (g.count === 1 ? ' διαμονή' : ' διαμονές'),
          spentText: this.money(g.spent),
          whenText: whenText, whenStyle: 'font-size: 13px; font-weight: 500; color: ' + whenColor,
          srcText: srcLabel(g),
          rowStyle: 'width: 100%; display: grid; grid-template-columns: 2.2fr 0.9fr 0.9fr 1.5fr 1fr; gap: 12px; align-items: center; padding: 8px 18px; min-height: 60px; border: 0; border-bottom: 1px solid #EEF2F2; color: #18282B; font-size: 14px; text-align: left; cursor: pointer;' + (s.customer === g.name ? 'background: #F0F6F6' : 'background: #FFFFFF'),
          open: () => this.openGuest(g.name)
        };
      });
    let guest = { close: () => {}, setNote: () => {}, message: () => {}, stays: [], badges: [] };
    let hasGuest = false;
    if (s.customer && gmap[s.customer]) {
      const g = gmap[s.customer];
      hasGuest = true;
      const bdBase = 'font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px;';
      const badges = [];
      if (g.count >= 2) badges.push({ label: 'Επιστρέφει', style: bdBase + 'background: #F3E3F0; color: #6B2F5F' });
      if (g.current) badges.push({ label: 'Μένει τώρα', style: bdBase + 'background: #DCEBEA; color: #0F5257' });
      else if (g.next) badges.push({ label: 'Έρχεται ' + this.fmt(g.next.start), style: bdBase + 'background: #DCE5F3; color: #1E3A5F' });
      if (g.pending) badges.push({ label: 'Αίτημα', style: bdBase + 'background: #FBEFD9; color: #7A4708' });
      const viaBooking = g.email === 'μέσω Booking';
      guest = {
        name: g.name, badges: badges,
        srcText: 'Κλείνει από: ' + srcLabel(g),
        count: String(g.count), spent: this.money(g.spent),
        email: g.email || '–', phone: g.phone || '–',
        stays: g.stays.slice().sort((a, c) => c.key.localeCompare(a.key)).map(st => ({
          when: st.when, what: st.what, money: this.money(st.money), status: st.status,
          disabled: !st.id,
          style: 'width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #E6ECED; background: #FFFFFF; color: #18282B; font-size: 14px; text-align: left;' + (st.id ? 'cursor: pointer' : 'cursor: default'),
          open: () => { if (st.id) this.open(st.id); }
        })),
        note: s.notes[g.name] || '',
        setNote: (e) => this.setState({ notes: Object.assign({}, s.notes, { [g.name]: e && e.target ? e.target.value : '' }) }),
        messageLabel: 'Μήνυμα στον πελάτη',
        canMessage: B.some(x => x.name === g.name && x.source === 'site' && x.status !== 'rejected'),
        message: () => { const gb = B.find(x => x.name === g.name && x.source === 'site' && x.status !== 'rejected'); if (gb) this.openThread(gb.id); },
        close: () => this.setState({ customer: null })
      };
    }

    /* Price calendar */
    const pm = s.priceMonth.split('-').map(Number);
    const pDays = new Date(Date.UTC(pm[0], pm[1], 0)).getUTCDate();
    const firstDow = (new Date(Date.UTC(pm[0], pm[1] - 1, 1)).getUTCDay() + 6) % 7;
    const priceCells = [];
    for (let i = 0; i < firstDow; i++) priceCells.push({ blank: true, real: false, pick: () => {} });
    const selSet = this.selDays();
    let closedInMonth = 0;
    for (let i = 1; i <= pDays; i++) {
      const x = s.priceMonth + '-' + (i < 10 ? '0' + i : String(i));
      const pr = this.priceFor(x);
      if (pr.closed) closedInMonth++;
      const past = x < T;
      const on = selSet.indexOf(x) !== -1;
      const dow = this.dt(x).getUTCDay();
      const edge = pr.own ? 'solid' : 'dashed';
      const look = on ? 'background: #DCEBEA; border: 1px solid #0F5257;'
        : (pr.closed ? 'background: #FBEAE8; border: 1px ' + edge + ' #E9C3BD;'
        : (pr.none ? 'background: #F4F2EE; border: 1px solid #F4F2EE;'
        : 'background: #FFFFFF; border: 1px ' + edge + ' ' + (pr.own ? '#8FA5A8' : '#B5C4C6') + ';'));
      const tag = !pr.own && pr.from ? '’' + String(pr.from).slice(2) : '';
      const what = pr.closed ? 'Κλειστά' : (pr.none ? '—' : this.money(pr.room));
      priceCells.push({
        blank: false, real: true,
        num: String(i), numStyle: 'font-size: 12px; font-weight: 600; color: ' + (dow === 0 || dow === 6 ? '#18282B' : '#4A5B5E'),
        hasTag: !!tag, tag: tag,
        room: what,
        roomStyle: 'display: block; font-size: 14px; font-weight: 600; white-space: nowrap; color: ' + (pr.closed ? '#A3271B' : (pr.own || pr.none ? '#18282B' : '#4A5B5E')),
        hasApt: !pr.closed && !pr.none && pr.apt != null, noApt: pr.closed || pr.none || pr.apt == null, apt: pr.apt != null ? this.money(pr.apt) : '',
        aptStyle: 'display: block; font-size: 14px; font-weight: 600; white-space: nowrap; color: ' + (pr.own ? '#18282B' : '#4A5B5E'),
        hasSub: pr.none && !pr.closed, sub: 'χωρίς τιμή',
        disabled: past, pressed: on ? 'true' : 'false',
        aria: this.fmt(x) + (pr.closed ? ', κλειστά' : (pr.none ? ', χωρίς τιμή' : ', δωμάτιο ' + this.money(pr.room) + ', διαμέρισμα ' + this.money(pr.apt))) + (tag ? ', όπως το ' + pr.from : ''),
        style: 'touch-action: none; user-select: none; -webkit-user-select: none; width: 100%; min-height: 62px; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; padding: 7px 8px; border-radius: 10px; text-align: left; color: #18282B;' + look + (past ? 'opacity: 0.45; cursor: default;' : 'cursor: pointer;') + (x === T ? 'box-shadow: inset 0 0 0 2px #E9B949;' : ''),
        date: x,
        down: (e) => {
          if (past) return;
          if (e && e.target && e.target.releasePointerCapture && e.pointerId != null) { try { e.target.releasePointerCapture(e.pointerId); } catch (err) {} }
          this.drag = { kind: 'price', anchor: x, moved: false };
        },
        pick: () => { if (this.justDragged) { this.justDragged = false; return; } if (!past) this.pickPriceDay(x); }
      });
    }
    const hasSel = selSet.length > 0;
    const selHasOver = selSet.some(d => !!s.overrides[d] && this.hasPrevYear(d));
    const selAllClosed = selSet.length > 0 && selSet.every(d => this.priceFor(d).closed);
    const roundTo5 = v => Math.max(5, Math.round(v / 5) * 5);
    const scaleDraft = f => {
      const d = s.draft;
      const sc = v => { const x = parseInt(v, 10); return x > 0 ? String(roundTo5(x * f)) : v; };
      this.setState({ draft: Object.assign({}, d, { room: sc(d.room), apt: sc(d.apt) }) });
    };
    const priceVals = {
      priceLabel: ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'][pm[1] - 1] + ' ' + pm[0],
      pricePrev: () => { const d = new Date(Date.UTC(pm[0], pm[1] - 2, 1)); this.setState({ priceMonth: d.toISOString().slice(0, 7) }); },
      priceNext: () => { const d = new Date(Date.UTC(pm[0], pm[1], 1)); this.setState({ priceMonth: d.toISOString().slice(0, 7) }); },
      priceDow: ['Δε', 'Τρ', 'Τε', 'Πε', 'Πα', 'Σα', 'Κυ'],
      priceCells: priceCells,
      priceNote: 'Σε κάθε μέρα: αριστερά η τιμή δωματίου ανά νύχτα, δεξιά του διαμερίσματος. Μέρα χωρίς φετινή τιμή παίρνει αυτή που είχε την ίδια ημερομηνία πέρσι (με διακεκομμένο πλαίσιο και τη χρονιά πάνω δεξιά).' + (closedInMonth ? ' Αυτόν τον μήνα ' + closedInMonth + (closedInMonth === 1 ? ' μέρα είναι κλειστή.' : ' μέρες είναι κλειστές.') : ''),
      hasSel: hasSel, noSel: !hasSel, selHasOver: selHasOver,
      selLabel: !hasSel ? '' : (selSet.length === 1 ? this.DAY[this.dt(selSet[0]).getUTCDay()] + ' ' + this.fmt(selSet[0]) : this.range(selSet[0], selSet[selSet.length - 1])),
      selSub: !hasSel ? '' : (selSet.length === 1 ? (s.sel.b ? '1 νύχτα' : '1 νύχτα · πάτα κι άλλη μέρα για διάστημα') : selSet.length + ' νύχτες'),
      draft: s.draft,
      setDraftRoom: e => this.setState({ draft: Object.assign({}, s.draft, { room: e && e.target ? e.target.value : '' }) }),
      setDraftApt: e => this.setState({ draft: Object.assign({}, s.draft, { apt: e && e.target ? e.target.value : '' }) }),
      setDraftMin: e => this.setState({ draft: Object.assign({}, s.draft, { min: e && e.target ? e.target.value : '' }) }),
      draftUp: () => scaleDraft(1.1),
      draftDown: () => scaleDraft(0.9),
      applyLabel: (selAllClosed ? 'Άνοιγμα · ' : 'Εφαρμογή σε ') + selSet.length + (selSet.length === 1 ? ' νύχτα' : ' νύχτες'),
      canClose: hasSel && !selAllClosed,
      closeLabel: 'Κλειστά' + (selSet.length > 1 ? ' · ' + selSet.length + ' μέρες' : ''),
      closeDays: () => {
        const no = Object.assign({}, s.overrides);
        selSet.forEach(d => { const p = this.priceFor(d); no[d] = { room: p.rawRoom, apt: p.rawApt, min: p.min != null ? p.min : 1, closed: true }; });
        const label = selSet.length === 1 ? this.fmt(selSet[0]) : this.range(selSet[0], selSet[selSet.length - 1]);
        this.setState({ overrides: no, sel: null });
        this.say(label + ': κλειστά. Το σάιτ δεν δέχεται αιτήματα αυτές τις μέρες.');
      },
      applyPrice: () => {
        const r = parseInt(s.draft.room, 10), a = parseInt(s.draft.apt, 10), m = parseInt(s.draft.min, 10);
        if (!(r > 0) || !(a > 0) || !(m >= 1)) { this.say('Συμπλήρωσε τιμή δωματίου, τιμή διαμερίσματος και ελάχιστες νύχτες.'); return; }
        const no = Object.assign({}, s.overrides);
        selSet.forEach(d => { no[d] = { room: r, apt: a, min: m, closed: false }; });
        const label = selSet.length === 1 ? this.fmt(selSet[0]) : this.range(selSet[0], selSet[selSet.length - 1]);
        this.setState({ overrides: no, sel: null });
        this.say(label + ': δωμάτιο ' + this.money(r) + ', διαμέρισμα ' + this.money(a) + ', από ' + m + (m === 1 ? ' νύχτα.' : ' νύχτες.'));
      },
      resetPrice: () => {
        const no = Object.assign({}, s.overrides);
        selSet.forEach(d => { if (this.hasPrevYear(d)) delete no[d]; });
        this.setState({ overrides: no, sel: null });
        this.say('Πήραν ξανά ό,τι είχαν την προηγούμενη χρονιά.');
      },
      clearSel: () => this.setState({ sel: null }),
      priceDragMove: (e) => {
        const d = this.drag;
        if (!d || d.kind !== 'price' || !e) return;
        if (e.pointerType === 'mouse' && e.buttons === 0) { this.drag = null; return; }
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const cell = el && el.closest ? el.closest('[data-date]') : null;
        const x = cell ? cell.getAttribute('data-date') : null;
        if (!x || x < T) return;
        if (x === d.anchor && !d.moved) return;
        d.moved = true;
        const a = x < d.anchor ? x : d.anchor, b = x < d.anchor ? d.anchor : x;
        const cur = this.state.sel;
        if (cur && cur.a === a && cur.b === b) return;
        const pr = this.priceFor(a);
        const keep = cur && cur.a === a;
        this.setState({ sel: { a: a, b: b }, draft: keep ? this.state.draft : this.draftFrom(pr) });
      },
      priceDragEnd: () => {
        const d = this.drag;
        if (d && d.moved) { this.justDragged = true; setTimeout(() => { this.justDragged = false; }, 0); }
        this.drag = null;
        if (d && d.kind === 'move') {
          if (this.state.calMove) this.setState({ calMove: null });
          if (d.moved && d.target && d.target !== d.from) {
            if (this._mvBlock) { this.say('Δεν γίνεται: το ' + this.unitName(d.target) + ' ' + this._mvBlock + '.'); }
            else if (this._mvSwap && this._mvSwap.a === d.id && this._mvSwap.to === d.target) { this.swapRooms(this._mvSwap); }
            else { const b = this.list().find(x => x.id === d.id); if (b) this.moveRoom(b, d.target, d.from); }
          }
        }
      },
      priceChannelNote: 'Ισχύει μόνο για το σάιτ, όχι για το Booking.'
    };

    const navBase = 'flex: 1 1 180px; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border: 0; border-radius: 12px; font-size: 15px; text-align: left; cursor: pointer;';
    const navOn = navBase + 'background: #0F5257; color: #FFFFFF; font-weight: 600';
    const navOff = navBase + 'background: transparent; color: #2E4448; font-weight: 500';

    removeOwner: function (email) { return this.ownersCall({ action: 'remove', email: email }).then(r => r.owners); },
    setNewPassword: function (pw) { return SB.auth.updateUser({ password: pw }).then(r => { if (r.error) throw new Error(greek(r.error.message)); }); },
    changePassword: function (email, current, next) {
      // Check the current password first, so an open laptop is not enough to change it.
      return SB.auth.signInWithPassword({ email: email, password: current }).then(r => {
        if (r.error) throw new Error(/invalid login/i.test(r.error.message) ? 'Ο τρέχων κωδικός δεν είναι σωστός.' : greek(r.error.message));
        return SB.auth.updateUser({ password: next });
      }).then(r => { if (r.error) throw new Error(/different from the old/i.test(r.error.message) ? 'Ο νέος κωδικός είναι ίδιος με τον τρέχοντα.' : greek(r.error.message)); });
    },
    resetPassword: function (email) {
      return SB.auth.resetPasswordForEmail(String(email).trim().toLowerCase(), { redirectTo: location.origin + location.pathname }).then(r => { if (r.error) throw new Error(greek(r.error.message)); });
    }
  };
  const PREVIEW_AUTH = (function () {
    const PREVIEW_USERS = [
      { id: 'owner-1', name: 'Ιδιοκτήτης Α', email: 'idioktitis.a@example.com', password: 'demo1234' },
      { id: 'owner-2', name: 'Ιδιοκτήτης Β', email: 'idioktitis.b@example.com', password: 'demo1234' }
    ];
    const KEY = 'lm-admin-session';
    const DAYS = 30;
    const pub = u => ({ id: u.id, name: u.name, email: u.email });
    const read = st => { try { return JSON.parse(st.getItem(KEY) || 'null'); } catch (e) { return null; } };
    const clear = () => { [localStorage, sessionStorage].forEach(st => { try { st.removeItem(KEY); } catch (e) {} }); };
    return {
      users: () => PREVIEW_USERS.map(pub),
      current: function () {
        let sess = null;
        try { sess = read(sessionStorage) || read(localStorage); } catch (e) {}
        if (!sess || !sess.id) return null;
        if (sess.exp && Date.now() > sess.exp) { clear(); return null; }
        const u = PREVIEW_USERS.find(x => x.id === sess.id);
        return u ? pub(u) : null;
      },
      signIn: function (email, password, remember) {
        return new Promise(function (resolve, reject) {
          setTimeout(function () {
            const e = String(email || '').trim().toLowerCase();
            const u = PREVIEW_USERS.find(x => x.email === e && x.password === password);
            if (!u) { reject(new Error('Λάθος email ή κωδικός.')); return; }
            clear();
            const sess = JSON.stringify({ id: u.id, exp: remember ? Date.now() + DAYS * 864e5 : null });
            try { (remember ? localStorage : sessionStorage).setItem(KEY, sess); } catch (err) {}
            resolve(pub(u));
          }, 350);
        });
      },
      signOut: function () { clear(); return Promise.resolve(); },
      updateName: function (email, name) {
        const u = PREVIEW_USERS.find(x => x.email === email);
        if (u) u.name = name;
        return Promise.resolve(PREVIEW_USERS.map(pub));
      },
      createOwner: function (email, name, password) {
        PREVIEW_USERS.push({ id: 'owner-' + Date.now(), name: name, email: email, password: password });
        return Promise.resolve({ owners: PREVIEW_USERS.map(pub) });
      },
      removeOwner: function (email) {
        const i = PREVIEW_USERS.findIndex(x => x.email === email);
        if (i >= 0) PREVIEW_USERS.splice(i, 1);
        return Promise.resolve(PREVIEW_USERS.map(pub));
      },
      changePassword: function (email, current, next) {
        const u = PREVIEW_USERS.find(x => x.email === email);
        if (!u || u.password !== current) return Promise.reject(new Error('Ο τρέχων κωδικός δεν είναι σωστός.'));
        u.password = next;
        return Promise.resolve();
      },
      resetPassword: function () { return Promise.resolve(); }
    };
  })();
  const AUTH = REAL_AUTH || PREVIEW_AUTH;

  const comp = new Component({ mode: mode, auth: AUTH, owners: AUTH.users(), onLogout: function () { Promise.resolve(AUTH.signOut()).then(showLogin, showLogin); } });
  let queued = false;

  window.scheduleRender = function () {
    if (queued) return;
    queued = true;
    Promise.resolve().then(function () { queued = false; render(); });
  };

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const parts = path.split('.');
    let v = scope[parts[0]];
    for (let i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (_, p) { const v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && lookup(m[1], scope)) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    if (tag === 'sc-part') {
      const pt = document.getElementById('part-' + node.getAttribute('name'));
      if (pt) pt.content.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    if (tag === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || '');
      const list = (m ? lookup(m[1], scope) : null) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        const sc = Object.create(scope);
        sc[as] = item; sc.$index = i;
        node.childNodes.forEach(function (c) { build(c, sc, out); });
      });
      return;
    }
    const el = document.createElementNS(node.namespaceURI, tag);
    for (const a of Array.from(node.attributes)) {
      const name = a.name, value = a.value;
      if (name.indexOf('hint-') === 0) continue;
      const m = WHOLE.exec(value);
      if (/^on[a-z]+$/.test(name)) {
        const fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') {
          let ev = name.slice(2);
          if (ev === 'change' && (tag === 'input' || tag === 'textarea')) ev = 'input';
          el.addEventListener(ev, function (e) { fn(e); });
        }
        continue;
      }
      if (m) {
        const v = lookup(m[1], scope);
        if (name === 'disabled' || name === 'checked') { if (v) el.setAttribute(name, ''); continue; }
        if (name === 'value') { el.value = v == null ? '' : v; el.setAttribute('value', v == null ? '' : v); continue; }
        if (v === false || v == null) continue;
        el.setAttribute(name, String(v));
        continue;
      }
      el.setAttribute(name, interp(value, scope));
    }
    const kids = [];
    node.childNodes.forEach(function (c) { build(c, scope, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  function render() {
    const act = document.activeElement;
    const id = act && act.id;
    const sel = id && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const scope = Object.assign(Object.create(null), comp.renderVals());
    const out = [];
    tpl.childNodes.forEach(function (c) { build(c, scope, out); });
    root.replaceChildren.apply(root, out);
    const cm = document.getElementById('conv-msgs');
    if (cm) cm.scrollTop = cm.scrollHeight;
    if (id) {
      const n = document.getElementById(id);
      if (n) { n.focus(); if (sel && n.setSelectionRange) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
    }
    paintBar();
  }

  const bar = document.getElementById('preview-bar');
  function paintBar() {
    bar.querySelectorAll('button').forEach(function (b) {
      const on = b.dataset.mode === mode;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.style.background = on ? '#0F5257' : '#FFFFFF';
      b.style.color = on ? '#FFFFFF' : '#18282B';
    });
  }
  bar.addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    mode = b.dataset.mode;
    comp.props = Object.assign({}, comp.props, { mode: mode });
    comp.setState({ detail: null, req: null, filter: 'all' });
    const u = new URL(location.href);
    if (mode === 'auto') u.searchParams.set('mode', 'auto'); else u.searchParams.delete('mode');
    history.replaceState(null, '', u);
  });

  /* Login screen */
  const login = document.getElementById('login');
  const form = document.getElementById('login-form');
  const fEmail = document.getElementById('login-email');
  const fPass = document.getElementById('login-pass');
  const fRemember = document.getElementById('login-remember');
  const fErr = document.getElementById('login-err');
  const fGo = document.getElementById('login-go');
  const fShow = document.getElementById('login-show');
  const demoList = document.getElementById('login-demo-list');
  const fInfo = document.getElementById('login-info');
  const fSub = document.querySelector('#login .sub'), fRow = document.querySelector('#login .row');
  let setPwUser = null; // signed in from an invitation or reset link, still has to choose a password
  function askNewPassword(user) {
    setPwUser = user;
    login.hidden = false; root.hidden = true;
    fSub.textContent = LINK_TYPE === 'invite' ? 'Καλώς ήρθες, ' + user.name + ' · διάλεξε τον κωδικό σου' : 'Διάλεξε νέο κωδικό';
    fEmail.value = user.email; fEmail.readOnly = true;
    fPass.value = ''; fPass.setAttribute('autocomplete', 'new-password');
    fRow.hidden = true; fGo.textContent = 'Αποθήκευση κωδικού'; fErr.textContent = ''; fInfo.textContent = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    setTimeout(function () { fPass.focus(); }, 0);
  }
  if (REAL_AUTH) document.getElementById('login-demo').hidden = true;
  if (NOLIB) { document.getElementById('login-demo').hidden = true; fErr.textContent = 'Δεν φορτώθηκε η σύνδεση με τον server. Έλεγξε το ίντερνετ και ανανέωσε τη σελίδα.'; fGo.disabled = true; }
  PREVIEW_AUTH.users().forEach(function (u) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = u.name;
    b.addEventListener('click', function () { fEmail.value = u.email; fPass.value = 'demo1234'; fErr.textContent = ''; fGo.focus(); });
    demoList.appendChild(b);
  });
  fShow.addEventListener('click', function () {
    const show = fPass.type === 'password';
    fPass.type = show ? 'text' : 'password';
    fShow.textContent = show ? 'Απόκρυψη' : 'Εμφάνιση';
    fShow.setAttribute('aria-pressed', show ? 'true' : 'false');
    fPass.focus();
  });
  document.getElementById('login-forgot').addEventListener('click', function () {
    fErr.textContent = fEmail.value.trim() ? '' : 'Γράψε πρώτα το email σου.';
    if (!fEmail.value.trim()) { fEmail.focus(); return; }
    AUTH.resetPassword(fEmail.value.trim()).then(function () {
      fErr.textContent = '';
      if (REAL_AUTH) fInfo.textContent = 'Αν το ' + fEmail.value.trim() + ' είναι λογαριασμός ιδιοκτήτη, σου στείλαμε email με σύνδεσμο για νέο κωδικό.';
      else alert('Στην προεπισκόπηση δεν στέλνεται email.');
    }, function (err) { fErr.textContent = err.message; });
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!fEmail.value.trim() || !fPass.value) { fErr.textContent = 'Συμπλήρωσε email και κωδικό.'; (fEmail.value.trim() ? fPass : fEmail).focus(); return; }
    if (setPwUser) {
      if (fPass.value.length < 8) { fErr.textContent = 'Ο κωδικός θέλει τουλάχιστον 8 χαρακτήρες.'; fPass.focus(); return; }
      fGo.disabled = true; fGo.textContent = 'Αποθήκευση…'; fErr.textContent = '';
      REAL_AUTH.setNewPassword(fPass.value).then(function () {
        const u = setPwUser; setPwUser = null;
        fEmail.readOnly = false; fRow.hidden = false; fSub.textContent = 'Διαχείριση · σύνδεση ιδιοκτήτη';
        fPass.setAttribute('autocomplete', 'current-password'); fGo.textContent = 'Σύνδεση';
        enter(u);
      }, function (err) { fErr.textContent = err.message; fGo.textContent = 'Αποθήκευση κωδικού'; fPass.focus(); }).then(function () { fGo.disabled = false; });
      return;
    }
    const label = fGo.textContent;
    fGo.disabled = true; fGo.textContent = 'Σύνδεση…'; fErr.textContent = ''; fInfo.textContent = '';
    AUTH.signIn(fEmail.value, fPass.value, fRemember.checked).then(function (user) { enter(user); }, function (err) {
      fErr.textContent = err.message; fPass.value = ''; fPass.focus();
    }).then(function () { fGo.disabled = false; if (fGo.textContent.endsWith('…')) fGo.textContent = label; });
  });
  function showLogin() {
    if (channel && SB) { SB.removeChannel(channel); channel = null; }
    clearInterval(startLive.t); PUSH.client = null;
    comp.setState({ user: null, tab: 'today', detail: null, req: null, customer: null, newOpen: false, nb: null, calSel: null, calEdit: false });
    root.hidden = true; bar.hidden = true; login.hidden = false;
    fPass.value = ''; fPass.type = 'password'; fShow.textContent = 'Εμφάνιση';
    setTimeout(function () { (fEmail.value ? fPass : fEmail).focus(); }, 0);
  }
  let channel = null;
  function loadRequests() {
    const from = comp.add(athensISO(), -400);
    return Promise.all([
      SB.from('booking_requests').select('*').eq('is_test', false).gte('check_out', from).order('created_at', { ascending: false }).limit(1000),
      SB.from('owner_stays').select('*').gte('check_out', from).order('check_in').limit(2000),
      SB.from('unit_blocks').select('unit, night').gte('night', comp.add(athensISO(), -60)).limit(5000),
      SB.from('request_messages').select('id, request_id, sender, body, created_at, created_by, read_at, email_status, email_error').order('created_at').limit(5000)
    ]).then(function (rs) {
      const bad = rs.find(function (r) { return r.error; });
      if (bad) { comp.say('Δεν φορτώθηκαν οι κρατήσεις: ' + bad.error.message); comp.setState({ live: false }); return; }
      comp.applyRows(rs[0].data || [], rs[1].data || [], rs[2].data || [], rs[3].data || []);
    });
  }
  function startLive() {
    PUSH.client = SB;
    comp.reload = loadRequests;
    comp.props = Object.assign({}, comp.props, { owners: AUTH.users() });
    loadRequests(); comp.loadFeeds(); comp.loadPrices();
    if (channel) SB.removeChannel(channel);
    channel = SB.channel('booking-requests').on('postgres_changes', { event: '*', schema: 'public', table: 'booking_requests' }, function (p) {
      if (p.eventType === 'INSERT' && p.new && p.new.name) comp.say('Νέο αίτημα από ' + p.new.name + '.');
      loadRequests();
    }).on('postgres_changes', { event: '*', schema: 'public', table: 'owner_stays' }, function () { loadRequests(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'unit_blocks' }, function () { loadRequests(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'request_messages' }, function () { loadRequests(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ical_feeds' }, function () { comp.loadFeeds(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'price_overrides' }, function () { comp.loadPrices(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'site_settings' }, function () { comp.loadFeeds(); comp.loadPrices(); }).subscribe();
    if (PUSH.on()) PUSH.syncServer().catch(function () { comp.setState({ toggles: Object.assign({}, comp.state.toggles, { push: false }) }); });
    // a request can expire while the page is open
    clearInterval(startLive.t); startLive.t = setInterval(loadRequests, 5 * 60000);
  }
  function enter(user) {
    comp.setState({ user: user });
    if (SB) startLive();
    login.hidden = true; root.hidden = false; bar.hidden = !params.has('mode');
    if (params.get('req')) comp.openReqById(params.get('req'));
    comp.say('Καλώς ήρθες, ' + user.name + '.');
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) {
    if (!e.data || !e.data.open || !comp.state.user) return;
    try { const id = new URL(e.data.open).searchParams.get('req'); if (id) comp.openReqById(id); } catch (err) {}
  });

  render();
  Promise.resolve(AUTH.current()).then(function (who) { if (who && LINK_TYPE && REAL_AUTH) askNewPassword(who); else if (who) enter(who); else showLogin(); }, showLogin);
})();

</script>
<script>
/* Menu icons: replay the icon animation each time a menu item is pressed. The page re-renders on click, so the item is looked up again by position after the render. */
(function () {
  var timer = null;
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('nav[aria-label="Μενού"] button') : null;
    if (!btn) return;
    var i = Array.prototype.indexOf.call(btn.parentNode.children, btn);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var nav = document.querySelector('nav[aria-label="Μενού"]');
      var b = nav && nav.children[i];
      if (!b) return;
      b.classList.remove('lm-play');
      void b.offsetWidth;
      b.classList.add('lm-play');
      clearTimeout(timer);
      timer = setTimeout(function () { b.classList.remove('lm-play'); }, 900);
    }); });
  }, true);
})();
</script>
</body>
