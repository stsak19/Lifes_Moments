<html lang="el">
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
.lm-xl{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;width:86px;height:34px;padding:0;border-radius:17px;border:1px solid #C3D1D3;background:#FFFFFF;color:#18282B;font-size:13px;font-weight:600;cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.lm-xl-ic{display:inline-flex;width:0;margin-right:0;opacity:0;overflow:hidden;transform:scale(.4) rotate(-90deg);transition:width .3s ease,margin-right .3s ease,opacity .25s ease,transform .4s cubic-bezier(.34,1.56,.64,1)}
.lm-xl-x{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .45s ease .12s}
.lm-xl:hover,.lm-xl:focus-visible{background:#217346;border-color:#217346;color:#FFFFFF}
.lm-xl:hover .lm-xl-ic,.lm-xl:focus-visible .lm-xl-ic{width:16px;margin-right:6px;opacity:1;transform:none}
.lm-xl:hover .lm-xl-x,.lm-xl:focus-visible .lm-xl-x{stroke-dashoffset:0}
.lm-xl:active{background:#185C37;border-color:#185C37}
.lm-cv{margin-left:6px}
.lm-cv:hover,.lm-cv:focus-visible{background:#18282B;border-color:#18282B}
.lm-cv:active{background:#0B1517;border-color:#0B1517}
.lm-cv:hover .lm-cv-arr,.lm-cv:focus-visible .lm-cv-arr{animation:lm-drop .9s ease .15s infinite}
.req-chip{transition:background-color .15s,color .15s}
.req-chip:hover,.req-chip:focus-visible{background:#FF004F!important;color:#FFFFFF!important}
.req-chip:hover *,.req-chip:focus-visible *{color:#FFFFFF!important;background:transparent!important}
@keyframes lm-blink{0%{box-shadow:0 0 0 0 rgba(176,0,54,.85)}70%{box-shadow:0 0 0 11px rgba(176,0,54,0)}100%{box-shadow:0 0 0 0 rgba(176,0,54,0)}}
@keyframes lm-drop{0%{transform:translateY(-6px);opacity:0}35%{transform:none;opacity:1}75%{transform:none;opacity:1}100%{transform:translateY(4px);opacity:0}}
@media (prefers-reduced-motion:reduce){.lm-xl,.lm-xl-ic,.lm-xl-x{transition:none}.lm-cv-arr{animation:none!important}}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:#EEF3F4}
a{color:#0F5257}a:hover{color:#0A3A3E}
button,input{font-family:inherit}
button:disabled{cursor:default}
#app > div{min-height:100vh !important}
#app main{padding-bottom:96px !important}
/* Desktop: sections menu on the left, page in the middle, detail panel on the right. The preview bar sits at the bottom of the menu. */
@media (min-width:900px){#app > div{flex-wrap:nowrap !important}aside[aria-label="Ενότητες"]{order:-1;position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto;border-left:0 !important;border-right:1px solid #D5E0E1;padding-bottom:84px !important}#preview-bar{box-sizing:border-box;width:216px;flex-wrap:nowrap;justify-content:center;padding:8px}#preview-bar .pv-label{display:none}}
#preview-bar{position:fixed;left:16px;bottom:16px;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:24px;background:#FFFFFF;box-shadow:0 4px 18px rgba(10,58,62,.18);font-family:Commissioner,system-ui,sans-serif;font-size:12px;color:#4A5B5E}
#login{min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#EEF3F4;font-family:Commissioner,system-ui,sans-serif;color:#18282B}
#login[hidden],#app[hidden],#preview-bar[hidden]{display:none}
#login form{width:100%;max-width:380px;box-sizing:border-box;background:#FFFFFF;border-radius:22px;padding:32px 28px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 40px rgba(10,58,62,.08)}
#login .brand{font-family:'GFS Didot',Georgia,serif;font-size:32px;line-height:1.1;color:#0F5257;margin:0}
#login .sub{font-size:14px;color:#4A5B5E;margin:2px 0 6px}
#login label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#4A5B5E}
#login input[type=email],#login input[type=password],#login input[type=text]{height:46px;box-sizing:border-box;width:100%;padding:0 14px;border-radius:12px;border:1px solid #C3D1D3;background:#FFFFFF;color:#18282B;font-size:15px;font-family:inherit}
#login input:focus,#login button:focus-visible{outline:2px solid #E9B949;outline-offset:1px}
#login .pw{position:relative}
#login .pw input{padding-right:84px}
#login .pw button{position:absolute;right:6px;top:6px;height:34px;padding:0 10px;border:0;border-radius:9px;background:#EEF3F4;color:#2E4448;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
#login .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
#login .row label{display:flex;align-items:center;gap:8px;cursor:pointer}
#login .link{border:0;background:none;padding:0;color:#0F5257;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
#login .go{height:48px;border:0;border-radius:24px;background:#0F5257;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
#login .go:disabled{opacity:.6;cursor:default}
#login .err{font-size:13px;font-weight:600;color:#8A3412;min-height:0}
#login .err:empty{display:none}
#login .info{font-size:13px;color:#0F5257;background:#E7F1F1;border-radius:12px;padding:10px 12px}
#login .info:empty{display:none}
#login .first{text-align:center;font-size:13px;color:#4A5B5E}
#login .demo{border-top:1px solid #EEF2F2;padding-top:14px;font-size:12px;color:#4A5B5E;display:flex;flex-direction:column;gap:8px}
#login .demo div{display:flex;gap:6px;flex-wrap:wrap}
#login .demo button{height:32px;padding:0 12px;border-radius:16px;border:1px solid #C3D1D3;background:#FFFFFF;color:#18282B;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
#inbox{min-height:520px}
#conv-msgs{min-height:220px;max-height:420px}
/* Messages fill the screen */
@media (min-width:900px){#app main:has(#inbox){padding-bottom:28px !important}#inbox{flex-wrap:nowrap !important;height:calc(100vh - 160px);min-height:460px}#app main:has(#inbox) aside[aria-label="Λεπτομέρειες κράτησης"]{top:28px;max-height:calc(100vh - 160px)}#inbox > div{min-height:0}#inbox .inbox-list{flex:0 0 260px !important;overflow-y:auto}#conv-msgs{min-height:0;max-height:none}}
/* Side panels (booking, guest, new booking) stay in view while the list scrolls */
@media (max-width:520px){.grp-mmeta{display:none}}
@media (min-width:900px){aside[aria-label="Λεπτομέρειες κράτησης"],aside[aria-label="Καρτέλα πελάτη"],aside[aria-label="Νέα κράτηση"],aside[aria-label="Λεπτομέρειες δωματίου"],aside[aria-label="Αίτημα στο ημερολόγιο"],aside.panel-slot{position:sticky;top:20px;align-self:flex-start;max-height:calc(100vh - 40px);overflow-y:auto;overscroll-behavior:contain;flex:0 0 340px !important}.content-row{flex-wrap:nowrap !important}aside[aria-label="Λεπτομέρειες κράτησης"] > *,aside[aria-label="Καρτέλα πελάτη"] > *,aside[aria-label="Νέα κράτηση"] > *,aside[aria-label="Λεπτομέρειες δωματίου"] > *,aside[aria-label="Αίτημα στο ημερολόγιο"] > *{flex-shrink:0}}
@media (max-width:899px){aside.panel-slot{display:none !important}}
/* Search and filters stay at the top while the list scrolls (desktop) */
.list-head{display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.list-head{position:sticky;top:0;z-index:6;background:#EEF3F4;padding:20px 0 14px;margin:-20px 0 -14px}}
/* Confirmations float over the page so nothing below them moves */
#app .toast{position:fixed;top:auto;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;box-sizing:border-box;width:max-content;max-width:min(640px,calc(100% - 32px));box-shadow:0 8px 28px rgba(10,58,62,.28)}
@media (min-width:900px){#app .toast{left:calc(50% + 124px)}}
#preview-bar button{height:32px;padding:0 12px;border-radius:16px;border:1px solid #C3D1D3;font-size:12px;font-weight:600;cursor:pointer}

/* Animated menu icons: play on hover and each time a menu item is pressed (class lm-play is added by the script at the end). */
nav[aria-label="Μενού"] button svg *{transform-box:fill-box;transform-origin:center}
nav[aria-label="Μενού"] button svg .ic-day{transform-origin:center}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-roof{animation:ic-lift .5s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-ring{animation:ic-lift .45s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-ring2{animation-delay:.06s}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-day{animation:ic-pop .5s .12s cubic-bezier(.34,1.56,.64,1) backwards}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-line{animation:ic-draw .45s ease backwards;transform-origin:left center}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-l2{animation-delay:.07s}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-l3{animation-delay:.14s}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-bubble{animation:ic-wiggle .55s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-person{animation:ic-hop .5s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-arc{animation:ic-spin .6s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-bar{animation:ic-draw .45s ease backwards;transform-origin:left center}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-b2{animation-delay:.08s}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-k1{animation:ic-slide-l .55s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-k2{animation:ic-slide-r .55s ease}
nav[aria-label="Μενού"] :is(button:hover,button.lm-play) svg .ic-k3{animation:ic-slide-l .55s .06s ease}
@keyframes ic-lift{0%{transform:translateY(0)}40%{transform:translateY(-2.5px)}100%{transform:translateY(0)}}
@keyframes ic-pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ic-draw{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes ic-wiggle{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(6deg) scale(1.08)}100%{transform:rotate(0) scale(1)}}
@keyframes ic-hop{0%{transform:translateY(0)}35%{transform:translateY(-3px)}65%{transform:translateY(0.5px)}100%{transform:translateY(0)}}
@keyframes ic-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes ic-slide-l{0%{transform:translateX(0)}50%{transform:translateX(-4px)}100%{transform:translateX(0)}}
@keyframes ic-slide-r{0%{transform:translateX(0)}50%{transform:translateX(4px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){nav[aria-label="Μενού"] button svg *{animation:none !important}}

/* Room calendar: a cell takes a colour while the mouse is over it (not on touch screens, not on selected cells). */
button[data-cell]{transition:background-color .12s ease}
@media (hover:hover){
button[data-cell]:not([data-sel="1"]):hover{background:#CFE4E2 !important}
button[data-cell][aria-label$="κλειστό"]:not([data-sel="1"]):hover{background:#A93B31 !important}
}

/* Sections menu: an item takes a light green while the mouse is over it (not the open one, not on touch screens). */
nav[aria-label="Μενού"] button{transition:background-color .15s ease}
@media (hover:hover){
nav[aria-label="Μενού"] button:not([style*="background: #0F5257"]):hover{background-color:#E2F0E9 !important}
}
</style>
</head>
<body>
<!-- Admin preview with fake data. Built from the Design canvas artboard Desktop.dc.html. -->
<div id="login" hidden>
<form id="login-form" novalidate aria-labelledby="login-title">
<div><h1 class="brand" id="login-title">Life's Moments</h1><p class="sub">Διαχείριση · σύνδεση ιδιοκτήτη</p></div>
<label class="f">Email<input id="login-email" type="email" autocomplete="username" required></label>
<label class="f">Κωδικός<span class="pw"><input id="login-pass" type="password" autocomplete="current-password" required><button type="button" id="login-show" aria-pressed="false">Εμφάνιση</button></span></label>
<div class="row"><label><input id="login-remember" type="checkbox" checked> Να με θυμάσαι</label><button type="button" class="link" id="login-forgot">Ξέχασες τον κωδικό;</button></div>
<div class="err" id="login-err" role="alert"></div>
<div class="info" id="login-info" role="status"></div>
<button type="submit" class="go" id="login-go">Σύνδεση</button>
<div class="demo" id="login-demo"><span>Προεπισκόπηση · δοκιμαστικοί λογαριασμοί μέχρι να φτιαχτούν τα προφίλ (κωδικός <b>demo1234</b>):</span><div id="login-demo-list"></div></div>
</form>
</div>
<div id="app" hidden></div>
<div id="preview-bar" role="group" aria-label="Εκδοχή προεπισκόπησης" title="Προεπισκόπηση με ψεύτικα δεδομένα" hidden>
<span class="pv-label">Προεπισκόπηση · ψεύτικα δεδομένα</span>
<button type="button" data-mode="manual">Με έγκριση</button>
<button type="button" data-mode="auto">Beds24</button>
</div>
<template id="tpl">
<div onPointerUp="{{priceDragEnd}}" style="min-height: 1000px; display: flex; flex-wrap: wrap-reverse; align-items: stretch; background: #EEF3F4; color: #18282B; font-family: Commissioner, system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 36px 56px; display: flex; flex-direction: column; gap: 22px">

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" class="toast" style="background: #0A3A3E; color: #FFFFFF; border-radius: 14px; padding: 12px 18px; font-size: 14px">{{toast}}</div>
</sc-if>

<sc-if value="{{page.show}}" hint-placeholder-val="{{true}}">
<header class="page-head" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px">
<div style="min-width: 0"><h1 style="{{page.titleStyle}}">{{page.title}}</h1><sc-if value="{{page.hasSub}}" hint-placeholder-val="{{true}}"><div style="{{page.subStyle}}">{{page.sub}}</div></sc-if></div>
<sc-if value="{{page.hasAction}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{page.action}}" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2.2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>{{page.actionLabel}}</button></sc-if>
</header>
</sc-if>

<div class="content-row" style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 22px">
<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<sc-if value="{{show.today}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 26px">

<section style="{{stripStyle}}">
<div style="flex: 0 1 auto">
<div style="{{stripTitleStyle}}">{{stripTitle}}</div>
<div style="{{stripSubStyle}}">{{stripSub}}</div>
</div>
<sc-if value="{{hasStripItems}}" hint-placeholder-val="{{true}}">
<div style="flex: 0 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<sc-for list="{{stripItems}}" as="it" hint-placeholder-count="3">
<button type="button" class="req-chip" onClick="{{it.open}}" style="flex: 0 1 auto; max-width: 240px; min-height: 60px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 10px 14px; border: 1.5px solid #FF004F; border-radius: 12px; background: #FFFFFF; color: #18282B; text-align: left; cursor: pointer">
<span style="display: flex; justify-content: space-between; gap: 12px"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span><span style="{{it.timerStyle}}">{{it.timer}}</span></span>
<span style="font-size: 12px; color: #4A5B5E">{{it.meta}}</span>
</button>
</sc-for>
</div>
</sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Φίλτρο δωματίων" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{statusChips}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}<span style="{{c.countStyle}}">{{c.count}}</span></button>
</sc-for>
</div>
</div>
<sc-if value="{{noTiles}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px; color: #4A5B5E">Κανένα δωμάτιο σε αυτή την κατάσταση σήμερα.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 45%), 1fr)); gap: 14px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
<article onClick="{{t.openRoom}}" style="{{t.card}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<button type="button" onClick="{{t.openRoom}}" aria-pressed="{{t.roomPressed}}" aria-label="{{t.roomAria}}" style="padding: 0; border: 0; background: transparent; color: #18282B; font-family: Piazzolla, Georgia, serif; font-size: 20px; font-weight: 600; text-align: left; cursor: pointer">{{t.unit}}</button>
<span style="{{t.pill}}">{{t.status}}</span>
</div>
<div style="margin-top: 10px">
<sc-if value="{{t.hasLink}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{t.openGuest}}" style="min-height: 30px; padding: 0; border: 0; background: transparent; color: #18282B; font-size: 15px; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: #A7B4B6; text-underline-offset: 3px; cursor: pointer">{{t.guest}}</button>
</sc-if>
<sc-if value="{{t.noLink}}" hint-placeholder-val="{{false}}">
<div style="min-height: 30px; display: flex; align-items: center; font-size: 15px; font-weight: 600">{{t.guest}}</div>
</sc-if>
<div style="font-size: 13px; color: #4A5B5E">{{t.sub}}</div>
</div>
<div role="img" aria-label="{{t.stripLabel}}" style="margin-top: 12px">
<div style="display: flex; gap: 3px">
<sc-for list="{{t.cells}}" as="c" hint-placeholder-count="14"><span style="{{c.style}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; color: #5A6B6E"><span>Σήμερα</span><span>{{t.stripEnd}}</span></div>
</div>
<div style="margin-top: auto; padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{t.hasAction}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{t.doAction}}" style="{{t.actionStyle}}">{{t.action}}</button>
</sc-if>
</div>
</article>
</sc-for>
</div>
</section>

</div>
</sc-if>

<sc-if value="{{show.cal}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{calPrev}}" aria-label="Μια εβδομάδα πίσω" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg></button>

<span style="display: flex; align-items: center; gap: 8px"><sc-if value="{{th.unread}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; width: 8px; height: 8px; border-radius: 4px; background: #C2502A"></span></sc-if><span style="{{th.nameStyle}}">{{th.name}}</span><span style="flex-shrink: 0; font-size: 12px; color: #4A5B5E">{{th.when}}</span></span>
<span style="display: block; font-size: 12px; color: #4A5B5E">{{th.meta}}</span>
<span style="display: block; font-size: 13px; color: #2E4448; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{th.preview}}</span>
</button>
</sc-for>
</div>
<div style="flex: 999 1 380px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #EEF2F2">
<div><div style="font-weight: 600; font-size: 16px">{{conv.name}}</div><div style="font-size: 13px; color: #4A5B5E">{{conv.meta}}</div></div>
</div>
<div id="conv-msgs" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #F7FAFA; overflow-y: auto">
<sc-for list="{{conv.msgs}}" as="m" hint-placeholder-count="2"><div style="{{m.style}}">{{m.text}}<span style="display: block; font-size: 12px; color: #4A5B5E; margin-top: 4px">{{m.when}}</span></div></sc-for>
<sc-if value="{{conv.empty}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: #4A5B5E">Δεν έχετε μιλήσει ακόμα. Γράψε το πρώτο μήνυμα.</div></sc-if>
</div>
<div style="padding: 14px 18px; border-top: 1px solid #EEF2F2; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; padding-top: 6px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4"><span style="position: relative; display: inline-flex"><button type="button" onClick="{{q.click}}" title="{{q.title}}" style="{{q.style}}">{{q.label}}</button><sc-if value="{{q.showX}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{q.remove}}" aria-label="{{q.removeLabel}}" title="Διαγραφή" style="position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #FFFFFF; background: #D92D20; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2)"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true" style="stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"></path></svg></button></sc-if></span></sc-for>
<button type="button" onClick="{{quickNew}}" style="min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px dashed #0F5257; background: #FFFFFF; color: #0F5257; font-size: 12px; font-weight: 600; cursor: pointer">+ Νέο κουμπί</button>
<sc-if value="{{hasQuick}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{quickToggleEdit}}" style="min-height: 32px; padding: 0 6px; border: 0; background: transparent; color: #0F5257; font-size: 12px; font-weight: 600; text-decoration: underline; cursor: pointer">{{quickEditLabel}}</button></sc-if>
</div>
<sc-if value="{{quickEditHint}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; color: #4A5B5E; margin-top: -4px">Πάτα το × για να σβήσεις ένα κουμπί, ή το ίδιο το κουμπί για να το αλλάξεις.</div></sc-if>
<sc-if value="{{qf.open}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F4F7F7; border: 1px solid #E6ECED">
<div style="font-weight: 600; font-size: 13px">{{qf.title}}</div>
<div><label for="qf-label" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 4px">Όνομα κουμπιού</label><input id="qf-label" type="text" maxlength="24" value="{{qf.label}}" onChange="{{qf.setLabel}}" placeholder="π.χ. Ψάρεμα, Πρωινό, Ferry" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 14px"></div>
<div><label for="qf-text" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 4px">Κείμενο που μπαίνει στην απάντηση</label><textarea id="qf-text" value="{{qf.text}}" onChange="{{qf.setText}}" placeholder="Γράψε το μήνυμα όπως θα το στέλνεις" style="width: 100%; box-sizing: border-box; min-height: 70px; padding: 8px 12px; border-radius: 10px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-family: inherit; font-size: 14px; line-height: 1.45; resize: vertical"></textarea></div>
<sc-if value="{{qf.hasError}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 13px; font-weight: 600; color: #8A3412">{{qf.error}}</div></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" onClick="{{qf.save}}" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Αποθήκευση</button>
<button type="button" onClick="{{qf.cancel}}" style="height: 38px; padding: 0 6px; border: 0; background: transparent; color: #0F5257; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer">Άκυρο</button>
<span style="flex: 1 1 0"></span>
<sc-if value="{{qf.canDelete}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{qf.remove}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #C9A49A; background: #FFFFFF; color: #8A3412; font-size: 13px; font-weight: 600; cursor: pointer">Διαγραφή</button></sc-if>
</div>
</div>
</sc-if>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Απάντηση</label>
<textarea id="msg" value="{{msgDraft}}" onChange="{{setMsgDraft}}" placeholder="Γράψε απάντηση…" style="width: 100%; box-sizing: border-box; min-height: 84px; padding: 10px 12px; border-radius: 12px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-family: inherit; font-size: 14px; line-height: 1.45; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><button type="button" onClick="{{sendMsg}}" style="height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Αποστολή</button><span style="font-size: 12px; color: #4A5B5E">{{conv.via}}</span></div>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{show.prices}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 18px">
<section aria-label="Τιμές ανά μέρα" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 18px 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px">
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{pricePrev}}" aria-label="Προηγούμενος μήνας" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #D5E0E1; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="min-width: 140px; text-align: center; font-family: Piazzolla, Georgia, serif; font-size: 20px; font-weight: 600">{{priceLabel}}</div>
<button type="button" onClick="{{priceNext}}" aria-label="Επόμενος μήνας" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #D5E0E1; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #4A5B5E">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 3px; border: 1px solid #8FA5A8; background: #FFFFFF"></span>Τιμή χρονιάς</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 3px; border: 1px dashed #8FA5A8; background: #FFFFFF"></span>Όπως πέρσι</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 3px; border: 1px solid #E9C3BD; background: #FBEAE8"></span>Κλειστά</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #DCEBEA"></span>Επιλογή</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px">
<sc-for list="{{priceDow}}" as="w" hint-placeholder-count="7">
<div style="text-align: center; font-size: 12px; font-weight: 600; color: #4A5B5E">{{w}}</div>
</sc-for>
</div>
<div onPointerMove="{{priceDragMove}}" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{priceCells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><div></div></sc-if>
<sc-if value="{{c.real}}" hint-placeholder-val="{{true}}">
<button type="button" data-date="{{c.date}}" onPointerDown="{{c.down}}" onClick="{{c.pick}}" disabled="{{c.disabled}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.style}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 4px"><span style="{{c.numStyle}}">{{c.num}}</span><sc-if value="{{c.hasTag}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 500; color: #6B7A7D">{{c.tag}}</span></sc-if></span>
<sc-if value="{{c.hasApt}}" hint-placeholder-val="{{true}}"><span style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-top: 5px"><span style="min-width: 0; padding-right: 5px"><span style="display: block; font-size: 10px; font-weight: 500; color: #6B7A7D; line-height: 1.2">Δωμ.</span><span style="{{c.roomStyle}}">{{c.room}}</span></span><span style="min-width: 0; padding-left: 6px; border-left: 1px solid #D5E0E1"><span style="display: block; font-size: 10px; font-weight: 500; color: #6B7A7D; line-height: 1.2">Διαμ.</span><span style="{{c.aptStyle}}">{{c.apt}}</span></span></span></sc-if>
<sc-if value="{{c.noApt}}" hint-placeholder-val="{{false}}"><span style="display: block; margin-top: 5px"><span style="{{c.roomStyle}}">{{c.room}}</span></span></sc-if>
<sc-if value="{{c.hasSub}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 12px; color: #4A5B5E">{{c.sub}}</span></sc-if>
</button>
</sc-if>
</sc-for>
</div>
<div style="font-size: 12px; color: #4A5B5E; margin-top: 12px">{{priceNote}}</div>
</section>

<aside aria-label="Τιμή" style="flex: 1 1 300px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Piazzolla, Georgia, serif; font-size: 19px; font-weight: 600">Τιμή</h2>
<sc-if value="{{noSel}}" hint-placeholder-val="{{true}}">
<div style="font-size: 14px; color: #4A5B5E">Πάτα μια μέρα στο ημερολόγιο. Για διάστημα, σύρε πάνω από τις μέρες με πατημένο το κλικ, ή πάτα την πρώτη και μετά την τελευταία.</div>
</sc-if>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div>
<div style="font-size: 17px; font-weight: 600">{{selLabel}}</div>
<div style="font-size: 13px; color: #4A5B5E">{{selSub}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div><label for="p-room" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 4px">Δωμάτιο</label><input id="p-room" type="number" inputmode="numeric" min="0" value="{{draft.room}}" onChange="{{setDraftRoom}}" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 16px; font-weight: 600"></div>
<div><label for="p-apt" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 4px">Διαμέρισμα (€)</label><input id="p-apt" type="number" inputmode="numeric" min="0" value="{{draft.apt}}" onChange="{{setDraftApt}}" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 16px; font-weight: 600"></div>
</div>
<div><label for="p-min" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 4px">Ελάχιστες νύχτες</label><input id="p-min" type="number" inputmode="numeric" min="1" value="{{draft.min}}" onChange="{{setDraftMin}}" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 16px; font-weight: 600"></div>
<button type="button" onClick="{{applyPrice}}" style="height: 46px; border-radius: 23px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">{{applyLabel}}</button>
<sc-if value="{{canClose}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{closeDays}}" style="height: 44px; border-radius: 22px; border: 1px solid #D9A39B; background: #FFFFFF; color: #A3271B; font-size: 14px; font-weight: 600; cursor: pointer">{{closeLabel}}</button>
</sc-if>
<sc-if value="{{selHasOver}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{resetPrice}}" style="height: 44px; border-radius: 22px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 14px; font-weight: 500; cursor: pointer">Όπως πέρσι</button>
</sc-if>
<button type="button" onClick="{{clearSel}}" style="height: 36px; padding: 0; border: 0; background: transparent; color: #0F5257; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer">Ακύρωση επιλογής</button>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; padding-top: 14px; border-top: 1px solid #E6ECED">
<span style="flex: 1 1 150px"><span style="display: block; font-weight: 600; white-space: nowrap">Επιπλέον άτομο</span><span style="display: block; font-size: 12px; color: #4A5B5E">Ανά νύχτα, πάνω από τα 2 άτομα</span></span>
<span style="display: flex; align-items: center; gap: 6px"><label for="p-extra" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Επιπλέον άτομο, € ανά νύχτα</label><input id="p-extra" type="number" inputmode="numeric" min="0" step="1" value="{{extraVal}}" onChange="{{setExtra}}" style="width: 90px; box-sizing: border-box; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 16px; font-weight: 600; text-align: right"><span style="font-weight: 600">€</span></span>
</div>
</aside>
</div>

</div>
</sc-if>

<sc-if value="{{show.settings}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section>
<h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 600; color: #4A5B5E">Προφίλ</h2>
<div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #EEF2F2">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: #E3F0EF; color: #0A3A3E; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">{{userInitials}}</span>
<span style="min-width: 0"><span style="display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{userName}}</span><span style="display: block; font-size: 12px; color: #4A5B5E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{pf.email}}</span></span>
</div>
<div style="padding: 12px 18px; border-bottom: 1px solid #EEF2F2"><label for="pf-name" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 6px">Όνομα (έτσι φαίνεται στον άλλον ιδιοκτήτη και στα μηνύματα)</label>
<div style="display: flex; gap: 8px"><input id="pf-name" type="text" autocomplete="name" maxlength="80" value="{{pf.name}}" onChange="{{pf.setName}}" style="flex: 1; min-width: 0; box-sizing: border-box; width: 100%; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 14px"><sc-if value="{{pf.nameDirty}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{pf.saveName}}" disabled="{{pf.busy}}" style="flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap">{{pf.nameLabel}}</button></sc-if></div></div>
<div style="border-bottom: 1px solid #EEF2F2">
<button type="button" onClick="{{pf.togglePw}}" aria-expanded="{{pf.pwAria}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border: 0; background: transparent; color: #18282B; font: inherit; text-align: left; cursor: pointer"><span><span style="display: block; font-weight: 500">Κωδικός</span><span style="display: block; font-size: 12px; color: #4A5B5E">Αλλαγή του κωδικού σύνδεσης</span></span><span style="flex-shrink: 0; font-size: 13px; font-weight: 600; color: #0F5257">{{pf.pwAction}}</span></button>
<sc-if value="{{pf.pwOpen}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 18px 16px; background: #F7FAFA">
<div><label for="pf-cur" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 6px">Τρέχων κωδικός</label><input id="pf-cur" type="password" autocomplete="current-password" value="{{pf.cur}}" onChange="{{pf.setCur}}" style="box-sizing: border-box; width: 100%; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 14px"></div>
<div><label for="pf-new" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 6px">Νέος κωδικός (τουλάχιστον 8 χαρακτήρες)</label><input id="pf-new" type="password" autocomplete="new-password" value="{{pf.nw}}" onChange="{{pf.setNew}}" style="box-sizing: border-box; width: 100%; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 14px"></div>
<div><label for="pf-new2" style="display: block; font-size: 12px; font-weight: 600; color: #4A5B5E; margin-bottom: 6px">Ξανά ο νέος κωδικός</label><input id="pf-new2" type="password" autocomplete="new-password" value="{{pf.nw2}}" onChange="{{pf.setNew2}}" style="box-sizing: border-box; width: 100%; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 14px"></div>
<sc-if value="{{pf.pwErr}}" hint-placeholder-val="{{false}}"><div role="alert" style="font-size: 12px; font-weight: 600; color: #8A3412">{{pf.pwErr}}</div></sc-if>
<button type="button" onClick="{{pf.savePw}}" disabled="{{pf.busy}}" style="align-self: flex-start; flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap">{{pf.pwLabel}}</button>
</div>
</sc-if>
</div>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="1">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #EEF2F2">
<span><span style="display: block; font-weight: 500">{{t.label}}</span><span style="display: block; font-size: 12px; color: #4A5B5E">{{t.sub}}</span></span>
<button type="button" role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="{{t.track}}"><span style="{{t.knob}}"></span></button>
</div>
</sc-for>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px">
<span style="font-size: 12px; color: #4A5B5E">Η αποσύνδεση ισχύει μόνο για αυτή τη συσκευή.</span>
<button type="button" onClick="{{logout}}" style="flex-shrink: 0; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; color: #8A3412">Αποσύνδεση</button>
</div>

<script>

/*
 * Push notifications for the owners, per device.
 * Today: the page asks permission, registers sw.js and shows test notifications through it.
 * Later: enable() also subscribes with the server's public VAPID key
 *   reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: VAPID_PUBLIC })
 * and saves the subscription in Supabase (one row per owner and device). An Edge Function
 * then sends a Web Push when a guest sends a request and 4 hours before it expires.
 * iPhone: push works only once the admin is added to the Home Screen and opened from there (iOS 16.4+).
 */
const LM_API = 'https://cwucmglctgklokxwbwqz.supabase.co', LM_KEY = 'sb_publishable_u-1Q2OU_vtTz70FAKJ71vA_3BiP0LaT';
function lmB64(s) { const p = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4); const b = atob(p); const o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
const PUSH = {
  OFF_KEY: 'lm-admin-push-off',
  reg: null,
  client: null, // the Supabase client once an owner is signed in; null in the demo
  /* Subscribe this browser with the server's key and save it, so the server can wake this phone. */
  syncServer() {
    const sb = this.client;
    if (!sb || this.perm() !== 'granted' || this.wantsOff()) return Promise.resolve(false);
    return this.ready().then(reg => sb.functions.invoke('push', { body: { action: 'key' } }).then(res => {
      if (res.error || !res.data || !res.data.publicKey) throw new Error('key');
      const key = lmB64(res.data.publicKey);
      return reg.pushManager.getSubscription().then(old => {
        const k = old && old.options && old.options.applicationServerKey ? new Uint8Array(old.options.applicationServerKey) : null;
        if (old && (!k || k.length !== key.length || k.some((x, i) => x !== key[i]))) return old.unsubscribe().then(() => null);
        return old;
      }).then(old => old || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
    })).then(sub => {
      const j = sub.toJSON();
      return sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: navigator.userAgent });
    }).then(r => { if (r.error) throw r.error; return true; });
  },
  stopServer() {

        cells.push({ style: 'flex: 1 1 0; height: ' + (i === 0 ? 14 : 10) + 'px; align-self: flex-end; border-radius: 2px; background: ' + c });
      }
      const roomOn = s.room === u.id;
      return {
        st: st, id: u.id,
        cells: cells, stripEnd: this.fmt(this.add(T, 13)),
        stripLabel: 'Επόμενες 14 μέρες: ' + nBooked + ' με κράτηση, ' + nShut + ' κλειστές, ' + (14 - nBooked - nShut) + ' ελεύθερες',
        openRoom: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (roomOn) this.setState({ room: null }); else this.openRoom(u.id); }, roomPressed: roomOn ? 'true' : 'false',
        roomAria: u.name + ': λεπτομέρειες δωματίου',
        roomBtnStyle: actBase + (roomOn ? 'border: 1px solid #0F5257; background: #0F5257; color: #FFFFFF' : 'border: 1px solid #C3D1D3; background: #FFFFFF; color: #2E4448'),
        unit: u.name, status: ST[st].label, pill: ST[st].pill,
        card: (u.id === 'apt' ? 'grid-column: span 2;' : '') + 'box-sizing: border-box; min-height: 150px; border-radius: 16px; padding: 16px 18px 16px 20px; display: flex; flex-direction: column; cursor: pointer; background: #FFFFFF; transition: box-shadow 0.15s;' + (roomOn ? 'border: 1px solid #0F5257; box-shadow: inset 4px 0 0 ' + (ST[st].accent === 'transparent' ? '#0F5257' : ST[st].accent) + ', 0 0 0 1px #0F5257' : (st === 'free' ? 'border: 1px dashed #B5C3C5' : 'border: 1px solid #E1E8E9') + '; box-shadow: inset 4px 0 0 ' + ST[st].accent),
        guest: guest, sub: sub, hasLink: !!linkTo, noLink: !linkTo,
        openGuest: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (linkTo) this.open(linkTo); },
        action: action, actionStyle: actionStyle, hasAction: !!action, doAction: doAction
      };
    });

    /* Room panel */
    const srcOf = b => b.source === 'booking' ? 'Booking' : (b.kind === 'free' ? 'Δωρεάν' : (b.kind === 'test' ? 'Δοκιμή' : (b.source === 'site' ? 'Σάιτ' : 'Απευθείας')));
    let room = { close: () => {}, newBooking: () => {}, nowOpen: () => {}, closeTonight: () => {}, openTonight: () => {}, toCal: () => {}, days: [], upcoming: [], shut: [], history: [] };
    let hasRoom = false;
    const ru = s.room ? this.UNITS.find(x => x.id === s.room) : null;
    if (ru) {
      hasRoom = true;
      const tile = tiles.find(x => x.id === ru.id);
      const closedMsg = auto ? ', και στο Booking αμέσως.' : '. Κλείνει και στο Booking στον επόμενο συγχρονισμό.';
      const DOWF = ['Κυριακή', 'Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο'];
      const dayBase = 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 48px; padding: 0; border-radius: 10px; cursor: pointer; font-family: inherit; line-height: 1.1;';
      const days = [];
      for (let i = 0; i < 14; i++) {
        const x = this.add(T, i);
        const d = this.dt(x);
        const o = this.occ(ru.id, x);
        const label = DOWF[d.getUTCDay()] + ' ' + this.fmt(x);
        let style, aria, click;
        if (o === 'block') {
          style = dayBase + 'cursor: default; border: 1px solid #B3261E; background: #B3261E; color: #FFFFFF';
          aria = label + ', κλειστό.';
          click = () => {};
        } else if (o) {
          style = dayBase + (o.source !== 'booking' ? 'border: 1px solid #0F5257; background: #0F5257; color: #FFFFFF' : 'border: 1px solid #8DB3E2; background: #8DB3E2; color: #0A2540');
          aria = label + ', ' + o.name + '. Πάτα για την κράτηση.';

        } else {

          aria = label + ', ελεύθερο.';
          click = () => {};
        }
        if (i === 0) style += '; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #18282B';
        days.push({ dow: i === 0 ? 'Σήμ' : this.DAY[d.getUTCDay()], num: String(d.getUTCDate()), style: style, aria: aria, click: click });
      }
      const mine = confirmed.filter(b => b.unit === ru.id && b.kind !== 'test');
      const mK = T.slice(0, 7), mFirst = mK + '-01', mNext = this.add(mK + '-28', 7).slice(0, 7) + '-01';
      const upcoming = mine.filter(b => b.start < mNext && this.endOf(b) > mFirst).sort((a, b) => a.start < b.start ? -1 : 1).map(b => ({
        name: b.name,
        dates: this.range(b.start, this.endOf(b)),
        when: this.range(b.start, this.endOf(b)) + ' · ' + b.nights + (b.nights === 1 ? ' νύχτα' : ' νύχτες') + (b.source === 'booking' ? '' : ' · ' + this.money(b.total)),
        src: srcOf(b),
        srcStyle: 'flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px;' + (b.source !== 'booking' ? 'background: #DCEBEA; color: #0F5257' : 'background: #DCE5F3; color: #1E3A5F'),
        open: () => this.open(b.id)
      }));
      const shutDates = Object.keys(s.blocks).filter(k => s.blocks[k] && k.split('|')[0] === ru.id).map(k => k.split('|')[1]).filter(x => x >= T).sort();
      const shut = [];
      shutDates.forEach(x => {
        const last = shut[shut.length - 1];
        if (last && this.add(last.to, 1) === x) last.to = x; else shut.push({ from: x, to: x });
      });
      const shutRows = shut.map(r => {
        let n = 1, x = r.from;
        while (x !== r.to) { x = this.add(x, 1); n++; }
        return {
          when: r.from === r.to ? this.fmt(r.from) : this.range(r.from, r.to),
          nights: n + (n === 1 ? ' νύχτα' : ' νύχτες'),
          reopen: () => {
            const nb = Object.assign({}, this.state.blocks);

            this.setState({ blocks: nb });
            this.say(ru.name + ' άνοιξε ξανά για ' + (n === 1 ? 'τη ' + this.fmt(r.from) : (n + ' νύχτες')) + '.');
          }
        };
      });
      const hist = mine.filter(b => this.endOf(b) <= T).map(b => ({ key: b.start, name: b.name, when: this.range(b.start, this.endOf(b)) + ' ' + b.start.slice(0, 4) + ' · ' + b.nights + ' νύχτες', money: b.source === 'booking' ? '' : this.money(b.total), src: srcOf(b) }))
        .concat(this.PAST.filter(p => p.unit === ru.name).map(p => ({ key: p.date, name: p.name, when: p.when + ' · ' + p.nights + ' νύχτες', money: this.money(p.total), src: p.source === 'site' ? 'Σάιτ' : 'Booking' })))
        .sort((a, b) => b.key.localeCompare(a.key)).slice(0, 3);
      /* This month */
      const mKey = T.slice(0, 7);
      const mIdx = Number(mKey.slice(5, 7)) - 1;
      let x = mKey + '-01', mDays = 0, mBooked = 0, mRev = 0;
      while (x.slice(0, 7) === mKey) {
        const o = this.occ(ru.id, x);
        if (o && o !== 'block' && o.kind !== 'test') { mBooked++; if (o.source !== 'booking') mRev += (o.total || 0) / o.nights; }
        mDays++; x = this.add(x, 1);
      }
      const tonight = this.occ(ru.id, T);
      room = {
        name: ru.name, status: tile.status, pill: tile.pill,
        capText: (ru.id === 'apt' ? 'Ξεχωριστό διαμέρισμα' : 'Δωμάτιο') + ' · ως ' + ru.cap + ' άτομα',
        nowTitle: tile.guest, nowSub: tile.sub, nowHasLink: tile.hasLink, nowNoLink: tile.noLink, nowOpen: tile.openGuest,
        occLabel: 'Νύχτες ' + this.MONG[mIdx], occText: mBooked + ' / ' + mDays,
        revLabel: 'Έσοδα σάιτ ' + this.MONG[mIdx], revText: this.money(mRev),
        days: days,
        upcoming: upcoming, noUpcoming: upcoming.length === 0, monthTitle: 'Κρατήσεις ' + this.MONG[mIdx],
        shut: shutRows, hasShut: shutRows.length > 0,
        history: hist, noHistory: hist.length === 0,
        canCloseTonight: !tonight, canOpenTonight: tonight === 'block',
        closeTonight: () => { this.block(ru.id, T); this.say(ru.name + ' κλειστό απόψε' + closedMsg); },
        openTonight: () => { this.unblockFrom(ru.id, T); this.say(ru.name + ' άνοιξε ξανά.'); },
        newBooking: () => { let st = T; while (!this.isFree(ru.id, st, 2) && st < this.add(T, 365)) st = this.add(st, 1); this.openNew({ type: ru.id === 'apt' ? 'apt' : 'room', unit: ru.id, start: st, end: this.add(st, 2), guests: String(Math.min(2, ru.cap)) }); },
        toCal: () => this.setState({ tab: 'cal', calStart: this.add(T, -2), room: null, detail: null, customer: null }),
        close: () => this.setState({ room: null })
      };
    }

    const tf = s.tileFilter || null;
    const shownTiles = tf ? tiles.filter(x => x.st === tf) : tiles;
    const chipDefs = [
      { id: null, label: 'Όλα', soft: 'background: #FFFFFF; color: #18282B; border: 1px solid #C3D1D3', solid: 'background: #18282B; color: #FFFFFF; border: 1px solid #18282B' },
      { id: 'stay', label: 'Μένουν', soft: 'background: #DCEBEA; color: #0F5257; border: 1px solid #DCEBEA', solid: 'background: #0F5257; color: #FFFFFF; border: 1px solid #0F5257' },
      { id: 'arr', label: 'Άφιξη', soft: 'background: #DCE5F3; color: #1E3A5F; border: 1px solid #DCE5F3', solid: 'background: #1E3A5F; color: #FFFFFF; border: 1px solid #1E3A5F' },
      { id: 'dep', label: 'Αναχώρηση', soft: 'background: #FBEFD9; color: #7A4708; border: 1px solid #FBEFD9', solid: 'background: #7A4708; color: #FFFFFF; border: 1px solid #7A4708' },
      { id: 'free', label: 'Ελεύθερο', soft: 'background: #FFFFFF; color: #3E4656; border: 1px dashed #A7B4B6', solid: 'background: #3E4656; color: #FFFFFF; border: 1px solid #3E4656' },
      { id: 'shut', label: 'Κλειστό', soft: 'background: #E4E1DB; color: #4A4F5C; border: 1px solid #E4E1DB', solid: 'background: #4A4F5C; color: #FFFFFF; border: 1px solid #4A4F5C' }
    ];
    const statusChips = chipDefs.map(c => {
      const on = c.id === tf;
      const n = c.id ? tiles.filter(x => x.st === c.id).length : tiles.length;
      return {
        label: c.label, count: String(n), pressed: on ? 'true' : 'false',
        style: 'display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13px; font-weight: 600; cursor: pointer;' + (on ? c.solid : c.soft) + (n === 0 && c.id ? '; opacity: 0.6' : ''),
        countStyle: 'min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; font-size: 12px; display: inline-flex; align-items: center; justify-content: center;' + (on ? 'background: rgba(255,255,255,0.22)' : 'background: rgba(24,40,43,0.08)'),
        pick: () => this.setState({ tileFilter: on ? null : c.id })
      };
    });

    let busy = 0;
    for (let i = 0; i < 7; i++) {
      const x = this.add(T, i);
      this.UNITS.forEach(u => { const o = this.occ(u.id, x); if (o && o !== 'block') busy++; });
    }
    const occupancy = Math.round(busy / (this.UNITS.length * 7) * 100) + '%';
    const siteRevenue = this.money(confirmed.filter(b => b.source === 'site' && b.start.slice(0, 7) === T.slice(0, 7)).reduce((a, b) => a + b.total, 0));

    /* Where each pending request sits on the calendar: most urgent first, the owner's pick if it fits, else the first room that fits */
    const tentative = {};
    const clashT = (unit, b) => pending.some(p => p.id !== b.id && tentative[p.id] === unit && p.start < this.endOf(b) && b.start < this.endOf(p));
    const fitsT = (unit, b) => this.isFree(unit, b.start, b.nights) && !clashT(unit, b);
    const wantOf = b => s.picks[b.id] || b.unit || null;
    if (!auto) pending.slice().sort((a, b) => (wantOf(a) ? 0 : 1) - (wantOf(b) ? 0 : 1)).forEach(b => {
      const cands = this.candidates(b);
      const want = wantOf(b);
      let u = (want && cands.some(c => c.id === want) && fitsT(want, b)) ? want : null;
      if (!u) { const c = cands.find(c2 => fitsT(c2.id, b)); u = c ? c.id : null; }
      if (u) tentative[b.id] = u;
    });

    /* Request view */
    let req = { back: () => this.setState({ req: null }), accept: () => {}, reject: () => {}, message: () => {}, rooms: [] };
    let showReq = false;
    const reqPending = auto ? [] : B.filter(b => b.status === 'pending').sort((a, b) => b.ago - a.ago);
    const reqId = !auto && s.tab === 'cal' && s.calReq && reqPending.some(b => b.id === s.calReq) ? s.calReq : null;
    if (reqId) {
      const rb = B.find(b => b.id === reqId && b.status === 'pending');
      if (rb) {
        showReq = true;
        const cands = this.candidates(rb);
        const freeIds = cands.filter(u => this.isFree(u.id, rb.start, rb.nights)).map(u => u.id);
        const suggested = (tentative[rb.id] && freeIds.indexOf(tentative[rb.id]) !== -1 ? tentative[rb.id] : null) || freeIds.find(id => !clashT(id, rb)) || freeIds[0] || null;
        const picked = (s.picks[rb.id] && freeIds.indexOf(s.picks[rb.id]) !== -1) ? s.picks[rb.id] : suggested;
        const left = 24 - rb.ago;
        const tag = 'flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px;';
        const ordered = cands.slice().sort((a, c) => (freeIds.indexOf(a.id) === -1) - (freeIds.indexOf(c.id) === -1));
        const rooms = ordered.map(u => {
          const free = freeIds.indexOf(u.id) !== -1;
          const on = u.id === picked;
          let note = '';
          if (!free) {
            const c = this.firstClash(u.id, rb.start, rb.nights);

          } else if (clashT(u.id, rb)) {
            const other = pending.find(p => p.id !== rb.id && tentative[p.id] === u.id && p.start < this.endOf(rb) && rb.start < this.endOf(p));
            note = 'Το ζητάει και ' + (other ? other.name : 'άλλο αίτημα');
          } else if (u.id === suggested && rb.type !== 'apt') {
            note = 'Αφήνει τα μεγαλύτερα ελεύθερα';
          }
          return {
            name: u.name, cap: 'Έως ' + u.cap + ' άτομα',
            note: note, hasNote: !!note,
            hasTag: (u.id === suggested) || !free,
            tag: !free ? 'Πιασμένο' : 'Προτείνεται',
            tagStyle: tag + ' align-self: flex-start; margin-top: auto;' + (!free ? 'background: #EEF2F2; color: #4A5B5E' : 'background: #DCEBEA; color: #0F5257'),
            check: 'flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;' + (on ? 'background: #0F5257; color: #FFFFFF' : free ? 'border: 2px solid #C3D1D3; color: transparent' : 'display: none'),
            tileStyle: 'display: flex; flex-direction: column; gap: 4px; min-height: 116px; padding: 14px; border-radius: 14px; color: #18282B; text-align: left; font: inherit; transition: background 0.15s, box-shadow 0.15s;' + (on ? 'border: 1px solid #0F5257; box-shadow: inset 0 0 0 1px #0F5257; background: #F0F6F6;' : 'border: 1px solid #DCE4E5; background: #FFFFFF;') + (free ? 'cursor: pointer' : 'cursor: default; background: #F6F8F8; opacity: 0.6'),
            disabled: !free, pressed: on ? 'true' : 'false',
            pick: () => { if (free) this.setState({ picks: Object.assign({}, s.picks, { [rb.id]: u.id }) }); }

        });
        req = {
          name: rb.name,
          label: 'Αίτημα κράτησης · από το σάιτ · πριν ' + rb.ago + (rb.ago === 1 ? ' ώρα' : ' ώρες'),
          timerText: 'Λήγει σε ' + left + (left === 1 ? ' ώρα' : ' ώρες'),
          expireNote: rb.priceless ? 'Αν δεν απαντήσεις, το αίτημα λήγει αυτόματα και οι μέρες ανοίγουν ξανά.' : 'Αν δεν απαντήσεις, η δέσμευση των ' + this.money(rb.total) + ' λύνεται αυτόματα και ο πελάτης παίρνει email.',
          usedText: rb.ago + ' από 24 ώρες',
          barFill: 'height: 8px; width: ' + Math.round(rb.ago / 24 * 100) + '%; background: ' + (left <= 6 ? '#C2502A' : '#C99A3B'),
          dates: this.range(rb.start, this.endOf(rb)), nights: String(rb.nights), guests: String(rb.guests), total: rb.priceless ? 'χωρίς τιμή' : this.money(rb.total),
          pickTitle: rb.type === 'apt' ? 'Διαμέρισμα' : 'Σε ποιο δωμάτιο;',
          rooms: rooms, noFree: !suggested, canAccept: !!picked, pickedName: picked ? this.unitName(picked) : '–', canDrag: rb.type === 'room',
          acceptLabel: s.checking === rb.id ? (this.REAL ? 'Αποθήκευση…' : 'Έλεγχος στο Booking.com…') : picked ? 'Αποδοχή στο ' + this.unitName(picked) + (rb.priceless ? '' : ' · χρέωση ' + this.money(rb.total)) : '',
          contact: rb.email + ' · ' + rb.phone,
          note: rb.note || '', hasNote: !!rb.note,
          hasPromo: !!rb.promo && rb.discountPct > 0,

          back: () => this.setState({ req: null }),

              this.setState({ checking: null });
              const clash = this.firstClash(picked, rb.start, rb.nights);
              if (clash) { this.say('Προσοχή: το ' + this.unitName(picked) + ' πιάστηκε στο μεταξύ' + (clash === 'block' ? '' : ' (' + clash.name + ')') + '. Διάλεξε άλλο δωμάτιο.'); return; }
              const ok = (this.REAL ? 'Επιβεβαιώθηκε · ' : 'Το Booking.com ελέγχθηκε τώρα, χωρίς σύγκρουση. Επιβεβαιώθηκε · ') + rb.name + ' στο ' + this.unitName(picked) + '.';
              if (rb.real) { this.saveDecision(rb, { status: 'confirmed', unit: picked, by: this.who('Αποδοχή') }, () => this.say(ok + ' Η χρέωση κάρτας και το email στον πελάτη μπαίνουν αργότερα.')); return; }
              this.patch(rb.id, { status: 'confirmed', unit: picked, by: this.who('Αποδοχή') });

          },

    }

    /* Requests list (left column of the Requests section) */
    const rowBase = 'width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; border: 0; border-top: 1px solid #EEF2F2; color: #18282B; font-size: 14px; text-align: left; cursor: pointer;';
    const answered = auto ? [] : B.filter(b => b.source === 'site' && b.status !== 'pending' && (b.real ? !!b.dbId : true))
      .sort((a, b) => this.bookedOn(a) < this.bookedOn(b) ? 1 : -1).slice(0, 30);
    const ansWord = b => b.status === 'confirmed' ? ['Αποδεκτό', 'background: #DCEBEA; color: #0F5257'] : b.status === 'cancelled' ? ['Ακυρώθηκε', 'background: #EEF2F2; color: #4A5B5E'] : b.expired ? ['Έληξε', 'background: #EEF2F2; color: #4A5B5E'] : ['Απορρίφθηκε', 'background: #FBE4DF; color: #8A3412'];
    const doneOpen = !!s.reqDoneOpen || reqPending.length === 0;
    const reqList = {
      pendingCount: String(reqPending.length), noPending: reqPending.length === 0,
      pending: reqPending.map(b => {
        const left = 24 - b.ago, on = false;
        return {
          name: b.name, current: on ? 'true' : 'false',
          meta: this.range(b.start, this.endOf(b)) + ' · ' + b.nights + (b.nights === 1 ? ' νύχτα' : ' νύχτες') + ' · ' + b.guests + ' άτομα · ' + (b.type === 'apt' ? 'διαμέρισμα' : 'δωμάτιο') + (b.priceless ? '' : ' · ' + this.money(b.total)),
          note: b.note || '', hasNote: !!b.note,
          timer: left + (left === 1 ? ' ώρα' : ' ώρες'), timerStyle: 'flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px;' + (left <= 6 ? 'background: #FBE4DF; color: #8A3412' : 'background: #FBEFD9; color: #7A4708'),
          style: rowBase + (on ? 'background: #F0F6F6; box-shadow: inset 3px 0 0 #0F5257' : 'background: #FFFFFF'),
          open: () => this.openReq(b.id)

    /* Bookings list */

    ].filter(Boolean);

    const q = (s.query || '').trim().toLowerCase();

    const ownMoney = list => list.filter(b => b.status === 'confirmed' && b.source !== 'booking').reduce((a, b) => a + b.total, 0);

    const liveB = listB.filter(b => b.status === 'confirmed');
    const listSummary = listB.length + (listB.length === 1 ? ' κράτηση' : ' κρατήσεις') + ' · ' + this.money(ownMoney(liveB)) + ' από σάιτ και απευθείας';

    const feeds = s.feeds || this.UNITS.map(u => ({ unit: u.id, import_url: null, export_token: 'preview-' + u.id }));
    const hhmm = t => { try { return new Intl.DateTimeFormat('el-GR', { timeZone: 'Europe/Athens', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(t)); } catch (e) { return ''; } };
    const bkLinked = feeds.filter(f => f.import_url).length;
