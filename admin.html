<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Life's Moments · Διαχείριση (προεπισκόπηση)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&amp;family=GFS+Didot&amp;family=Piazzolla:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF3F4}
a{color:#0F5257}a:hover{color:#0A3A3E}
button,input{font-family:inherit}
button:disabled{cursor:default}
#app > div{min-height:100vh !important}
#app main{padding-bottom:96px !important}
#preview-bar{position:fixed;left:16px;bottom:16px;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:24px;background:#FFFFFF;box-shadow:0 4px 18px rgba(10,58,62,.18);font-family:Commissioner,system-ui,sans-serif;font-size:12px;color:#4A5B5E}
#preview-bar button{height:32px;padding:0 12px;border-radius:16px;border:1px solid #C3D1D3;font-size:12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<!-- Admin preview with fake data. Built from the Design canvas artboard Desktop.dc.html. -->
<div id="app"></div>
<div id="preview-bar" role="group" aria-label="Εκδοχή προεπισκόπησης">
<span>Προεπισκόπηση · ψεύτικα δεδομένα</span>
<button type="button" data-mode="manual">Με έγκριση</button>
<button type="button" data-mode="auto">Αυτόματη (Beds24)</button>
</div>
<template id="tpl">
<div style="min-height: 1000px; display: flex; flex-wrap: wrap-reverse; align-items: stretch; background: #EEF3F4; color: #18282B; font-family: Commissioner, system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 36px 56px; display: flex; flex-direction: column; gap: 22px">

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="background: #0A3A3E; color: #FFFFFF; border-radius: 14px; padding: 12px 18px; font-size: 14px">{{toast}}</div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 22px">
<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<sc-if value="{{show.today}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 26px">

<section style="{{stripStyle}}">
<div style="flex: 0 1 260px">
<div style="{{stripTitleStyle}}">{{stripTitle}}</div>
<div style="font-size: 13px; color: #4A5B5E">{{stripSub}}</div>
</div>
<sc-if value="{{hasStripItems}}" hint-placeholder-val="{{true}}">
<div style="flex: 1 1 460px; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{stripItems}}" as="it" hint-placeholder-count="3">
<button type="button" onClick="{{it.open}}" style="flex: 1 1 200px; min-height: 60px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 10px 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: #18282B; text-align: left; cursor: pointer">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{it.name}}</span><span style="{{it.timerStyle}}">{{it.timer}}</span></span>
<span style="font-size: 12px; color: #4A5B5E">{{it.meta}}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{hasStripBtn}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{stripBtn}}" style="flex: 0 0 auto; height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Απάντησε</button>
</sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Piazzolla, Georgia, serif; font-size: 30px; font-weight: 500">Το κατάλυμα σήμερα <span style="font-size: 16px; color: #4A5B5E">· {{occupiedText}}</span></h1>
<div role="group" aria-label="Φίλτρο δωματίων" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{statusChips}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}<span style="{{c.countStyle}}">{{c.count}}</span></button>
</sc-for>
</div>
</div>
<sc-if value="{{noTiles}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px; color: #4A5B5E">Κανένα δωμάτιο σε αυτή την κατάσταση σήμερα.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
<article style="{{t.card}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-family: Piazzolla, Georgia, serif; font-size: 20px; font-weight: 600">{{t.unit}}</span>
<span style="{{t.pill}}">{{t.status}}</span>
</div>
<div style="margin-top: 10px">
<sc-if value="{{t.hasLink}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{t.openGuest}}" style="min-height: 30px; padding: 0; border: 0; background: transparent; color: #18282B; font-size: 15px; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: #A7B4B6; text-underline-offset: 3px; cursor: pointer">{{t.guest}}</button>
</sc-if>
<sc-if value="{{t.noLink}}" hint-placeholder-val="{{false}}">
<div style="min-height: 30px; display: flex; align-items: center; font-size: 15px; font-weight: 600">{{t.guest}}</div>
</sc-if>
<div style="font-size: 13px; color: #4A5B5E">{{t.sub}}</div>
</div>
<sc-if value="{{t.hasAction}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{t.doAction}}" style="{{t.actionStyle}}">{{t.action}}</button>
</sc-if>
</article>
</sc-for>
</div>
</section>

</div>
</sc-if>

<sc-if value="{{show.req}}" hint-placeholder-val="{{false}}">
<section aria-label="Αίτημα κράτησης" style="background: #FFFFFF; border-radius: 20px; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 24px">
<button type="button" onClick="{{req.back}}" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; border-radius: 20px; border: 1px solid #D5E0E1; background: #FFFFFF; color: #18282B; font-size: 13px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>Πίσω στο Σήμερα</button>
<div>
<div style="font-size: 13px; font-weight: 600; color: #7A4708">{{req.label}}</div>
<h1 style="margin: 4px 0 0; font-family: Piazzolla, Georgia, serif; font-size: 34px; font-weight: 600">{{req.name}}</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 14px"><span style="font-weight: 600">{{req.timerText}}</span><span style="color: #4A5B5E">{{req.usedText}}</span></div>
<div style="height: 8px; border-radius: 4px; background: #F1E9DD; overflow: hidden"><div style="{{req.barFill}}"></div></div>
<div style="font-size: 13px; color: #4A5B5E">Αν δεν απαντήσεις, η δέσμευση των {{req.total}} λύνεται αυτόματα και ο πελάτης παίρνει email.</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #E6ECED; border: 1px solid #E6ECED; border-radius: 12px; overflow: hidden">
<div style="background: #FFFFFF; padding: 12px 14px"><div style="font-size: 12px; color: #4A5B5E">Ημερομηνίες</div><div style="font-weight: 600">{{req.dates}}</div></div>
<div style="background: #FFFFFF; padding: 12px 14px"><div style="font-size: 12px; color: #4A5B5E">Νύχτες</div><div style="font-weight: 600">{{req.nights}}</div></div>
<div style="background: #FFFFFF; padding: 12px 14px"><div style="font-size: 12px; color: #4A5B5E">Άτομα</div><div style="font-weight: 600">{{req.guests}}</div></div>
<div style="background: #FFFFFF; padding: 12px 14px"><div style="font-size: 12px; color: #4A5B5E">Σύνολο</div><div style="font-weight: 600">{{req.total}}</div></div>
</div>

<div>
<h2 style="margin: 0 0 8px; font-family: Piazzolla, Georgia, serif; font-size: 19px; font-weight: 600">{{req.pickTitle}}</h2>
<div style="border: 1px solid #E6ECED; border-radius: 12px; overflow: hidden">
<sc-for list="{{req.rooms}}" as="rm" hint-placeholder-count="4">
<button type="button" onClick="{{rm.pick}}" disabled="{{rm.disabled}}" aria-pressed="{{rm.pressed}}" style="{{rm.rowStyle}}">
<span style="{{rm.radio}}"></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">{{rm.name}}</span><span style="display: block; font-size: 13px; color: #4A5B5E">{{rm.sub}}</span></span>
<sc-if value="{{rm.hasTag}}" hint-placeholder-val="{{false}}"><span style="{{rm.tagStyle}}">{{rm.tag}}</span></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{req.noFree}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 8px; font-size: 13px; color: #8A3412">Δεν υπάρχει ελεύθερος χώρος για αυτές τις μέρες. Μπορείς μόνο να το απορρίψεις.</div>
</sc-if>
</div>

<div>
<h2 style="margin: 0 0 8px; font-family: Piazzolla, Georgia, serif; font-size: 19px; font-weight: 600">Πελάτης</h2>
<div style="font-size: 14px; color: #2E4448">{{req.contact}}</div>
<sc-if value="{{req.hasNote}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #F4F7F7; font-size: 14px">«{{req.note}}»</div>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding-top: 18px; border-top: 1px solid #E6ECED">
<button type="button" onClick="{{req.reject}}" style="height: 46px; padding: 0 22px; border-radius: 23px; border: 1px solid #C3D1D3; background: #FFFFFF; color: #18282B; font-size: 15px; font-weight: 600; cursor: pointer">Απόρριψη</button>
<sc-if value="{{req.canAccept}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{req.accept}}" style="height: 46px; padding: 0 26px; border-radius: 23px; border: 0; background: #0F5257; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">{{req.acceptLabel}}</button>
</sc-if>
</div>
</section>
</sc-if>

<sc-if value="{{show.cal}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{calPrev}}" aria-label="Μια εβδομάδα πίσω" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" onClick="{{calNext}}" aria-label="Μια εβδομάδα μπροστά" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg></button>
<h1 style="margin: 0 4px; font-family: Piazzolla, Georgia, serif; font-size: 28px; font-weight: 500">{{calTitle}}</h1>
<button type="button" onClick="{{calToday}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #FFFFFF; color: #18282B; font-size: 13px; font-weight: 500; cursor: pointer">Σήμερα</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #4A5B5E">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #0F5257"></span>Σάιτ</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #CFE0F3"></span>Booking.com</span>
<sc-if value="{{isManual}}" hint-placeholder-val="{{true}}"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1px dashed #B7791F; background: #FBEFD9"></span>Αίτημα</span></sc-if>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #E4E1DB"></span>Κλειστό</span>
</div>
</div>

<section aria-label="Ημερολόγιο δωματίων" style="background: #FFFFFF; border-radius: 18px; padding: 16px; overflow-x: auto">
<div style="min-width: 940px">
<div style="{{calRowStyle}}">
<span></span>
<sc-for list="{{head}}" as="h" hint-placeholder-count="14">
<div style="{{h.style}}"><span style="display: block; font-size: 11px">{{h.dow}}</span><span style="display: block; font-size: 14px">{{h.num}}</span></div>
</sc-for>
</div>
<sc-if value="{{hasReqRows}}" hint-placeholder-val="{{true}}">
<div>
<div style="font-size: 12px; font-weight: 600; color: #8A3412; margin: 10px 0 6px">Αιτήματα που δεν χωράνε σε κανένα δωμάτιο</div>
<sc-for list="{{reqRows}}" as="row" hint-placeholder-count="3">
<div style="{{calRowStyle}}">
<span style="font-size: 12px; color: #4A5B5E; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{row.label}}</span>
<sc-for list="{{row.segs}}" as="sg" hint-placeholder-count="10">
<button type="button" onClick="{{sg.tap}}" aria-label="{{sg.aria}}" style="{{sg.style}}">{{sg.label}}</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
<div style="font-size: 12px; font-weight: 600; color: #4A5B5E; margin: 14px 0 6px">Δωμάτια</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
<div style="{{calRowStyle}}">
<span style="font-size: 13px; font-weight: 500; display: flex; align-items: center; white-space: nowrap">{{row.label}}</span>
<sc-for list="{{row.segs}}" as="sg" hint-placeholder-count="10">
<button type="button" onClick="{{sg.tap}}" aria-label="{{sg.aria}}" style="{{sg.style}}">{{sg.label}}</button>
</sc-for>
</div>
</sc-for>
</div>
</section>
<div style="font-size: 13px; color: #4A5B5E">{{calNote}}</div>
</div>
</sc-if>

<sc-if value="{{show.list}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Piazzolla, Georgia, serif; font-size: 28px; font-weight: 500">Κρατήσεις</h1>
<div style="flex: 0 1 300px">
<label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Αναζήτηση ονόματος</label>
<input id="search" type="search" value="{{query}}" onChange="{{setQuery}}" placeholder="Αναζήτηση ονόματος" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; font-size: 14px">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="background: #FFFFFF; border-radius: 18px; overflow-x: auto">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 2fr 1.3fr 1.3fr 0.6fr 0.8fr 0.9fr; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #E6ECED; font-size: 12px; font-weight: 600; color: #4A5B5E">
<span>Πελάτης</span><span>Ημερομηνίες</span><span>Χώρος</span><span>Άτομα</span><span>Ποσό</span><span>Κατάσταση</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<button type="button" onClick="{{it.open}}" style="{{it.rowStyle}}">
<span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.name}}</span>
<span>{{it.dates}}</span>
<span style="color: #2E4448">{{it.unit}}</span>
<span>{{it.guests}}</span>
<span style="font-weight: 500">{{it.money}}</span>
<span><span style="{{it.badgeStyle}}">{{it.badge}}</span></span>
</button>
</sc-for>
<sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
<div style="padding: 18px; color: #4A5B5E">Καμία κράτηση δεν ταιριάζει.</div>
</sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{show.guests}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Piazzolla, Georgia, serif; font-size: 28px; font-weight: 500">Πελάτες <span style="font-size: 16px; color: #4A5B5E">· {{guestTotal}}</span></h1>
<div style="flex: 0 1 300px">
<label for="gsearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Αναζήτηση πελάτη</label>
<input id="gsearch" type="search" value="{{gQuery}}" onChange="{{setGQuery}}" placeholder="Όνομα, email ή τηλέφωνο" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; font-size: 14px">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{gFilters}}" as="f" hint-placeholder-count="5">
<button type="button" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="background: #FFFFFF; border-radius: 18px; overflow-x: auto">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 2.2fr 0.9fr 0.9fr 1.5fr 1fr; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #E6ECED; font-size: 12px; font-weight: 600; color: #4A5B5E">
<span>Πελάτης</span><span>Διαμονές</span><span>Σύνολο</span><span>Πότε</span><span>Από</span>
</div>
<sc-for list="{{guests}}" as="g" hint-placeholder-count="8">
<button type="button" onClick="{{g.open}}" style="{{g.rowStyle}}">
<span style="min-width: 0"><span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.name}}</span><sc-if value="{{g.returning}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #F3E3F0; color: #6B2F5F">Επιστρέφει</span></sc-if></span><span style="display: block; font-size: 12px; color: #4A5B5E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.contact}}</span></span>
<span>{{g.staysText}}</span>
<span style="font-weight: 500">{{g.spentText}}</span>
<span style="{{g.whenStyle}}">{{g.whenText}}</span>
<span style="color: #2E4448">{{g.srcText}}</span>
</button>
</sc-for>
<sc-if value="{{noGuests}}" hint-placeholder-val="{{false}}">
<div style="padding: 18px; color: #4A5B5E">Κανένας πελάτης δεν ταιριάζει.</div>
</sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{show.stats}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Piazzolla, Georgia, serif; font-size: 28px; font-weight: 500">Στατιστικά</h1>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{statPrev}}" aria-label="Προηγούμενος μήνας" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="min-width: 150px; text-align: center; font-family: Piazzolla, Georgia, serif; font-size: 20px; font-weight: 600">{{statLabel}}</div>
<button type="button" onClick="{{statNext}}" aria-label="Επόμενος μήνας" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #18282B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>

<section style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
<div style="flex: 1 1 200px; background: #FFFFFF; border-radius: 16px; padding: 16px 18px">

  add(s, n) { const d = this.dt(s); d.setUTCDate(d.getUTCDate() + n); return this.iso(d); }
  fmt(s) { const d = this.dt(s); return d.getUTCDate() + ' ' + this.MON[d.getUTCMonth()]; }
  endOf(b) { return this.add(b.start, b.nights); }
  range(a, z) {
    const x = this.dt(a), y = this.dt(z);
    if (x.getUTCMonth() === y.getUTCMonth()) return x.getUTCDate() + '–' + y.getUTCDate() + ' ' + this.MON[y.getUTCMonth()];
    return this.fmt(a) + ' – ' + this.fmt(z);
  }
  money(n) { return '€' + Math.round(n).toLocaleString('el-GR'); }
  unitName(id) { const u = this.UNITS.find(x => x.id === id); return u ? u.name : ''; }
  isAuto() { return (this.props.mode || 'manual') === 'auto'; }

  occ(unit, date, ignore) {
    const b = this.list().find(x => x.id !== ignore && x.status === 'confirmed' && x.unit === unit && x.start <= date && date < this.endOf(x));
    if (b) return b;
    if (this.state.blocks[unit + '|' + date]) return 'block';
    return null;
  }
  isFree(unit, start, nights, ignore) {
    for (let i = 0; i < nights; i++) { if (this.occ(unit, this.add(start, i), ignore)) return false; }
    return true;
  }
  firstClash(unit, start, nights) {
    for (let i = 0; i < nights; i++) { const o = this.occ(unit, this.add(start, i)); if (o) return o; }
    return null;
  }
  candidates(b) {
    if (b.type === 'apt') return this.UNITS.filter(u => u.id === 'apt');
    return this.UNITS.filter(u => u.id !== 'apt' && u.cap >= b.guests).sort((a, c) => a.cap - c.cap || a.n - c.n);
  }
  autoAssign(list, blocks) {
    const out = list.map(b => Object.assign({}, b));
    const busy = (unit, date) => out.some(x => x.status === 'confirmed' && x.unit === unit && x.start <= date && date < this.endOf(x)) || !!blocks[unit + '|' + date];

      b.unit = u ? u.id : null;

    });
    return out;

    const srcText = b => b.source === 'site' ? 'σάιτ' : 'Booking';

    /* Strip */

    let stripItems, stripTitle, stripSub, stripStyle, stripTitleStyle, hasStripBtn = false, stripBtn = () => {};

    if (!auto) {

    } else {
      const n = feed.length;
      stripItems = feed.map(b => ({
        name: b.name,
        meta: this.range(b.start, this.endOf(b)) + ' · ' + (b.unit ? this.unitName(b.unit) : 'χωρίς δωμάτιο') + ' · ' + srcText(b),

      stripStyle = stripBase + 'background: #DCEBEA';
      stripTitleStyle = 'font-family: Piazzolla, Georgia, serif; font-size: 22px; font-weight: 600; color: #0A3A3E';
    }

    /* Tiles */
    const pillBase = 'flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px;';
    const ST = {
      stay: { label: 'Μένουν', pill: pillBase + 'background: #DCEBEA; color: #0F5257', card: 'background: #FFFFFF; border: 1px solid #FFFFFF' },
      arr: { label: 'Άφιξη', pill: pillBase + 'background: #DCE5F3; color: #1E3A5F', card: 'background: #FFFFFF; border: 1px solid #FFFFFF' },
      dep: { label: 'Αναχώρηση', pill: pillBase + 'background: #FBEFD9; color: #7A4708', card: 'background: #FFFFFF; border: 1px solid #FFFFFF' },

      shut: { label: 'Κλειστό', pill: pillBase + 'background: #E4E1DB; color: #4A4F5C', card: 'background: #F4F2EE; border: 1px solid #F4F2EE' }
    };
    const actBase = 'margin-top: 12px; min-height: 40px; padding: 0 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;';
    let occupied = 0, arrivals = 0, departures = 0;
    const tiles = this.UNITS.map(u => {
      const cur = confirmed.find(b => b.unit === u.id && b.start <= T && T < this.endOf(b));
      const dep = confirmed.find(b => b.unit === u.id && this.endOf(b) === T);
      const blocked = !!s.blocks[u.id + '|' + T];
      const next = confirmed.filter(b => b.unit === u.id && b.start > T).sort((a, b) => a.start < b.start ? -1 : 1)[0];
      let st, guest, sub, linkTo = null;
      if (cur && cur.start === T) { st = 'arr'; guest = cur.name; sub = 'Άφιξη 15:00 · ' + cur.nights + ' νύχτες · ' + srcText(cur); linkTo = cur.id; }
      else if (cur) { st = 'stay'; guest = cur.name; sub = 'Ως ' + this.fmt(this.endOf(cur)) + ' · ' + srcText(cur); linkTo = cur.id; }
      else if (dep) { st = 'dep'; guest = dep.name; sub = 'Φεύγει ως 11:00' + (next && next.start === this.add(T, 1) ? ' · αύριο ' + next.name : ''); linkTo = dep.id; }
      else if (blocked) { let d = T; while (s.blocks[u.id + '|' + d]) d = this.add(d, 1); st = 'shut'; guest = 'Κλειστό'; sub = 'Ανοίγει ' + this.fmt(d); }
      else { st = 'free'; guest = 'Ελεύθερο απόψε'; sub = next ? 'Επόμενη: ' + next.name + ', ' + this.fmt(next.start) : 'Καμία επόμενη κράτηση'; }
      if (st === 'stay' || st === 'arr') occupied++;
      if (st === 'arr') arrivals++;
      if (dep) departures++;
      let action = '', actionStyle = '', doAction = () => {};
      if (dep) {
        const done = !!s.cleaned[dep.id];
        action = done ? 'Καθαρίστηκε' : 'Θέλει καθάρισμα';
        actionStyle = actBase + (done ? 'border: 1px solid #2F6B4F; background: #E1EFE7; color: #1F5039' : 'border: 1px solid #D9B86A; background: #FFFFFF; color: #7A4708');
        doAction = () => this.setState({ cleaned: Object.assign({}, s.cleaned, { [dep.id]: !done }) });
      } else if (st === 'free') {

        doAction = () => { this.block(u.id, T); this.say(u.name + ' κλειστό απόψε' + (auto ? ', και στο Booking αμέσως.' : '. Κλείνει και στο Booking στον επόμενο συγχρονισμό.')); };

        doAction = () => { this.unblockFrom(u.id, T); this.say(u.name + ' άνοιξε ξανά.'); };
      }
      return {
        st: st,
        unit: u.name, status: ST[st].label, pill: ST[st].pill,
        card: 'box-sizing: border-box; min-height: 150px; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column;' + ST[st].card,
        guest: guest, sub: sub, hasLink: !!linkTo, noLink: !linkTo,
        openGuest: () => { if (linkTo) this.open(linkTo); },
        action: action, actionStyle: actionStyle, hasAction: !!action, doAction: doAction
      };
    });

    const tf = s.tileFilter || null;
    const shownTiles = tf ? tiles.filter(x => x.st === tf) : tiles;
    const chipDefs = [
      { id: null, label: 'Όλα', soft: 'background: #FFFFFF; color: #18282B; border: 1px solid #C3D1D3', solid: 'background: #18282B; color: #FFFFFF; border: 1px solid #18282B' },
      { id: 'stay', label: 'Μένουν', soft: 'background: #DCEBEA; color: #0F5257; border: 1px solid #DCEBEA', solid: 'background: #0F5257; color: #FFFFFF; border: 1px solid #0F5257' },
      { id: 'arr', label: 'Άφιξη', soft: 'background: #DCE5F3; color: #1E3A5F; border: 1px solid #DCE5F3', solid: 'background: #1E3A5F; color: #FFFFFF; border: 1px solid #1E3A5F' },

      { id: 'shut', label: 'Κλειστό', soft: 'background: #E4E1DB; color: #4A4F5C; border: 1px solid #E4E1DB', solid: 'background: #4A4F5C; color: #FFFFFF; border: 1px solid #4A4F5C' }

    const statusChips = chipDefs.map(c => {
      const on = c.id === tf;

        countStyle: 'min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; font-size: 11px; display: inline-flex; align-items: center; justify-content: center;' + (on ? 'background: rgba(255,255,255,0.22)' : 'background: rgba(24,40,43,0.08)'),
        pick: () => this.setState({ tileFilter: on ? null : c.id })
      };
    });

    let busy = 0;
    for (let i = 0; i < 7; i++) {
      const x = this.add('2026-07-13', i);
      this.UNITS.forEach(u => { const o = this.occ(u.id, x); if (o && o !== 'block') busy++; });
    }
    const occupancy = Math.round(busy / (this.UNITS.length * 7) * 100) + '%';
    const siteRevenue = this.money(confirmed.filter(b => b.source === 'site' && b.start.slice(5, 7) === '07').reduce((a, b) => a + b.total, 0));

    /* Where each pending request sits on the calendar: most urgent first, the owner's pick if it fits, else the first room that fits */
    const tentative = {};
    const clashT = (unit, b) => pending.some(p => p.id !== b.id && tentative[p.id] === unit && p.start < this.endOf(b) && b.start < this.endOf(p));
    const fitsT = (unit, b) => this.isFree(unit, b.start, b.nights) && !clashT(unit, b);
    if (!auto) pending.forEach(b => {
      const cands = this.candidates(b);
      const want = s.picks[b.id];
      let u = (want && cands.some(c => c.id === want) && fitsT(want, b)) ? want : null;
      if (!u) { const c = cands.find(c2 => fitsT(c2.id, b)); u = c ? c.id : null; }
      if (u) tentative[b.id] = u;
    });

    /* Request view */
    let req = { back: () => this.setState({ req: null }), accept: () => {}, reject: () => {}, rooms: [] };
    let showReq = false;
    if (!auto && s.req) {
      const rb = B.find(b => b.id === s.req && b.status === 'pending');
      if (rb) {
        showReq = true;
        const cands = this.candidates(rb);
        const freeIds = cands.filter(u => this.isFree(u.id, rb.start, rb.nights)).map(u => u.id);
        const suggested = freeIds.find(id => !clashT(id, rb)) || freeIds[0] || null;
        const picked = (s.picks[rb.id] && freeIds.indexOf(s.picks[rb.id]) !== -1) ? s.picks[rb.id] : suggested;
        const left = 24 - rb.ago;
        const tag = 'flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px;';
        const ordered = cands.slice().sort((a, c) => (freeIds.indexOf(a.id) === -1) - (freeIds.indexOf(c.id) === -1));
        const rooms = ordered.map(u => {
          const free = freeIds.indexOf(u.id) !== -1;
          const on = u.id === picked;
          let sub = 'Έως ' + u.cap + ' άτομα · ελεύθερο ' + this.range(rb.start, this.endOf(rb));
          if (!free) {
            const c = this.firstClash(u.id, rb.start, rb.nights);
            sub = 'Έως ' + u.cap + ' άτομα · ' + (c === 'block' ? 'κλειστό αυτές τις μέρες' : c.name + ' ως ' + this.fmt(this.endOf(c)));
          } else if (clashT(u.id, rb)) {
            const other = pending.find(p => p.id !== rb.id && tentative[p.id] === u.id && p.start < this.endOf(rb) && rb.start < this.endOf(p));
            sub += ' · το ζητάει και το αίτημα του/της ' + (other ? other.name : 'άλλου πελάτη');
          } else if (u.id === suggested && rb.type !== 'apt') {

          }
          return {
            name: u.name, sub: sub,
            hasTag: (u.id === suggested) || !free,
            tag: !free ? 'Πιασμένο' : 'Προτείνεται',
            tagStyle: tag + (!free ? 'background: #EEF2F2; color: #4A5B5E' : 'background: #DCEBEA; color: #0F5257'),
            radio: 'flex-shrink: 0; width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box;' + (on ? 'border: 6px solid #0F5257' : 'border: 2px solid #A7B4B6'),
            rowStyle: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; border: 0; border-bottom: 1px solid #EEF2F2; color: #18282B; text-align: left;' + (on ? 'background: #F0F6F6;' : 'background: #FFFFFF;') + (free ? 'cursor: pointer' : 'cursor: default; opacity: 0.55'),
            disabled: !free, pressed: on ? 'true' : 'false',
            pick: () => { if (free) this.setState({ picks: Object.assign({}, s.picks, { [rb.id]: u.id }) }); }
          };
        });
        req = {
          name: rb.name,
          label: 'Αίτημα κράτησης · από το σάιτ · πριν ' + rb.ago + (rb.ago === 1 ? ' ώρα' : ' ώρες'),
          timerText: 'Λήγει σε ' + left + (left === 1 ? ' ώρα' : ' ώρες'),
          usedText: rb.ago + ' από 24 ώρες',
          barFill: 'height: 8px; width: ' + Math.round(rb.ago / 24 * 100) + '%; background: ' + (left <= 6 ? '#C2502A' : '#C99A3B'),
          dates: this.range(rb.start, this.endOf(rb)), nights: String(rb.nights), guests: String(rb.guests), total: this.money(rb.total),
          pickTitle: rb.type === 'apt' ? 'Διαμέρισμα' : 'Σε ποιο δωμάτιο;',
          rooms: rooms, noFree: !suggested, canAccept: !!picked,
          acceptLabel: picked ? 'Αποδοχή στο ' + this.unitName(picked) + ' · χρέωση ' + this.money(rb.total) : '',
          contact: rb.email + ' · ' + rb.phone,
          note: rb.note || '', hasNote: !!rb.note,
          back: () => this.setState({ req: null }),
          accept: () => {
            if (!picked) return;
            this.patch(rb.id, { status: 'confirmed', unit: picked });
            this.setState({ req: null });
            this.say('Επιβεβαιώθηκε · ' + rb.name + ' στο ' + this.unitName(picked) + '. Χρεώθηκαν ' + this.money(rb.total) + ' και ο πελάτης πήρε email.');
          },
          reject: () => {

            this.setState({ req: null });
            this.say('Απορρίφθηκε · η δέσμευση των ' + this.money(rb.total) + ' λύθηκε και ο πελάτης ενημερώθηκε.');
          }
        };
      }
    }

    /* Calendar */
    const days = [];
    for (let i = 0; i < 14; i++) days.push(this.add(s.calStart, i));
    const calRowStyle = 'display: grid; grid-template-columns: 124px repeat(14, minmax(0, 1fr)); gap: 3px; margin-bottom: 3px';
    const head = days.map(x => {
      const d = this.dt(x);
      const wk = d.getUTCDay() === 0 || d.getUTCDay() === 6;
      return { dow: this.DAY[d.getUTCDay()], num: d.getUTCDate(), style: 'text-align: center; line-height: 1.15; padding: 4px 0; border-radius: 10px;' + (x === T ? 'background: #0F5257; color: #FFFFFF; font-weight: 600' : (wk ? 'color: #18282B; font-weight: 500' : 'color: #4A5B5E')) };
    });
    const segBase = 'height: 34px; min-width: 0; box-sizing: border-box; border-radius: 8px; font-size: 12px; font-weight: 500; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; cursor: pointer;';
    const emptyCell = (aria, x, tap) => ({ label: '', aria: aria, tap: tap, style: segBase + 'padding: 0; border: 0; background: ' + (x === T ? '#E3EEEE' : '#F4F7F7') });
    const pendAt = (unit, x) => auto ? null : (pending.find(p => tentative[p.id] === unit && p.start <= x && x < this.endOf(p)) || null);
    const rows = this.UNITS.map(u => {
      const segs = [];
      let i = 0;
      while (i < days.length) {
        const x = days[i];
        const o = this.occ(u.id, x);
        if (o && o !== 'block') {
          let j = i;
          while (j + 1 < days.length && this.occ(u.id, days[j + 1]) === o) j++;
          const span = j - i + 1;
          segs.push({ label: span > 1 ? o.name : o.name.charAt(0), aria: u.name + ', ' + o.name + ', ' + this.range(o.start, this.endOf(o)), tap: () => this.open(o.id),

            tap: () => { const nb = Object.assign({}, s.blocks); delete nb[u.id + '|' + x]; this.setState({ blocks: nb }); this.say(u.name + ' · ' + this.fmt(x) + ' άνοιξε ξανά.'); } });

          const span = j - i + 1;
          segs.push({ label: span > 1 ? 'Αίτημα · ' + p.name : '!', aria: 'Αίτημα ' + p.name + ', προτείνεται ' + u.name + ', ' + this.range(p.start, this.endOf(p)), tap: () => this.openReq(p.id),
            style: segBase + 'grid-column: span ' + span + '; border: 1px dashed #B7791F; background: #FBEFD9; color: #5C3606; font-weight: 600' });
          i = j + 1;
        } else {
          segs.push(emptyCell(u.name + ', ' + this.fmt(x) + ', ελεύθερο', x, () => { this.block(u.id, x); this.say(u.name + ' · ' + this.fmt(x) + ' κλειστό' + (auto ? ', και στο Booking αμέσως.' : '. Κλείνει και στο Booking στον επόμενο συγχρονισμό.')); }));
          i++;
        }
      }
      return { label: u.name, segs: segs };
    });
    const reqRows = auto ? [] : pending.filter(b => !tentative[b.id]).map(b => {
      const segs = [];
      const end = this.endOf(b);
      let i = 0;
      while (i < days.length) {
        const x = days[i];
        if (b.start <= x && x < end) {
          let j = i;
          while (j + 1 < days.length && days[j + 1] < end) j++;
          const span = j - i + 1;
          segs.push({ label: span > 1 ? b.name + ' · ' + b.guests + ' άτ.' : b.name.charAt(0), aria: 'Αίτημα ' + b.name + ', ' + this.range(b.start, end), tap: () => this.openReq(b.id),
            style: segBase + 'grid-column: span ' + span + '; border: 1px dashed #B7791F; background: #FBEFD9; color: #5C3606' });
          i = j + 1;
        } else {
          segs.push({ label: '', aria: '', tap: () => {}, style: 'height: 34px; border-radius: 8px; background: transparent; border: 0; padding: 0; cursor: default' });
          i++;
        }
      }
      return { label: b.type === 'apt' ? 'Διαμέρισμα · ' + b.guests + ' άτ.' : 'Δωμάτιο · ' + b.guests + ' άτ.', segs: segs };
    });
    const d0 = this.dt(days[0]), d1 = this.dt(days[13]);
    const calTitle = d0.getUTCMonth() === d1.getUTCMonth()
      ? d0.getUTCDate() + ' – ' + d1.getUTCDate() + ' ' + this.MONG[d1.getUTCMonth()]
      : d0.getUTCDate() + ' ' + this.MONG[d0.getUTCMonth()] + ' – ' + d1.getUTCDate() + ' ' + this.MONG[d1.getUTCMonth()];

    /* Bookings list */
    const filtDefs = [
      { id: 'all', label: 'Όλες', fn: () => true },
      auto ? { id: 'new', label: 'Νέες', fn: b => b.status === 'confirmed' && b.ago != null && b.ago < 24 } : { id: 'pending', label: 'Αιτήματα', fn: b => b.status === 'pending' },
      { id: 'site', label: 'Σάιτ', fn: b => b.source === 'site' },
      { id: 'booking', label: 'Booking', fn: b => b.source === 'booking' }
    ];
    const filters = filtDefs.map(f => ({ label: f.label + ' · ' + B.filter(f.fn).length, style: f.id === s.filter ? chipOn : chipOff, pick: () => this.setState({ filter: f.id }) }));
    const curFilter = (filtDefs.find(f => f.id === s.filter) || filtDefs[0]).fn;
    const q = (s.query || '').trim().toLowerCase();

      name: b.name,
      dates: this.range(b.start, this.endOf(b)),
      unit: b.unit ? this.unitName(b.unit) : (b.type === 'apt' ? 'Διαμέρισμα' : 'Χωρίς δωμάτιο'),
      guests: String(b.guests),
      money: this.money(b.total),

    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && lookup(m[1], scope)) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    if (tag === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || '');
      const list = (m ? lookup(m[1], scope) : null) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        const sc = Object.create(scope);
        sc[as] = item; sc.$index = i;
        node.childNodes.forEach(function (c) { build(c, sc, out); });
      });
      return;
    }
    const el = document.createElementNS(node.namespaceURI, tag);
    for (const a of Array.from(node.attributes)) {
      const name = a.name, value = a.value;
      if (name.indexOf('hint-') === 0) continue;
      const m = WHOLE.exec(value);
      if (/^on[a-z]+$/.test(name)) {
        const fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') {
          let ev = name.slice(2);
          if (ev === 'change' && (tag === 'input' || tag === 'textarea')) ev = 'input';
          el.addEventListener(ev, function (e) { fn(e); });
        }
        continue;
      }
      if (m) {
        const v = lookup(m[1], scope);
        if (name === 'disabled' || name === 'checked') { if (v) el.setAttribute(name, ''); continue; }
        if (name === 'value') { el.value = v == null ? '' : v; el.setAttribute('value', v == null ? '' : v); continue; }
        if (v === false || v == null) continue;
        el.setAttribute(name, String(v));
        continue;
      }
      el.setAttribute(name, interp(value, scope));
    }
    const kids = [];
    node.childNodes.forEach(function (c) { build(c, scope, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  function render() {
    const act = document.activeElement;
    const id = act && act.id;
    const sel = id && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
    const scope = Object.assign(Object.create(null), comp.renderVals());
    const out = [];
    tpl.childNodes.forEach(function (c) { build(c, scope, out); });
    root.replaceChildren.apply(root, out);
    if (id) {
      const n = document.getElementById(id);
      if (n) { n.focus(); if (sel && n.setSelectionRange) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
    }
    paintBar();
  }

  const bar = document.getElementById('preview-bar');
  function paintBar() {
    bar.querySelectorAll('button').forEach(function (b) {
      const on = b.dataset.mode === mode;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.style.background = on ? '#0F5257' : '#FFFFFF';
      b.style.color = on ? '#FFFFFF' : '#18282B';
    });
  }
  bar.addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    mode = b.dataset.mode;
    comp.props = { mode: mode };
    comp.setState({ detail: null, req: null, filter: 'all' });
    const u = new URL(location.href);
    if (mode === 'auto') u.searchParams.set('mode', 'auto'); else u.searchParams.delete('mode');
    history.replaceState(null, '', u);
  });

  render();
})();

</script>
</body>
</html>
