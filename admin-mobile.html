<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LM Διαχείριση</title>
<link rel="manifest" href="admin-mobile.webmanifest">
<meta name="theme-color" content="#0F5257">
<link rel="apple-touch-icon" href="icons/admin-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LM Διαχείριση">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EEF3F4; --card:#FFFFFF; --ink:#18282B; --muted:#5B6E71; --line:#D5E0E1;
  --teal:#0F5257; --teal-2:#1C6E74; --teal-soft:#DCEBEC;
  --yellow:#F6C343; --yellow-soft:#FFF4CC; --yellow-ink:#5A4300;
  --red:#C2412D; --red-soft:#FBE7E3;
  --booking:#2E5EAA; --booking-soft:#DCE6F6;
  --direct:#0F5257; --free:#7A8B2E;
  --tab-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:16px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(238,243,244,.92);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.top .sub{font-size:13px;color:var(--muted);font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:20px;border:0;background:var(--card);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(10,58,62,.08);cursor:pointer;flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.brandmark{width:34px;height:34px;color:var(--teal);flex-shrink:0;display:block}
.av{width:36px;height:36px;border-radius:18px;background:var(--yellow);color:#3A2604;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- screens ---------- */
main{padding:4px 16px calc(var(--tab-h) + var(--safe-b) + 24px)}
.sec{margin:20px 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
.sec a,.sec button.link{text-transform:none;letter-spacing:0;font-weight:600;color:var(--teal);background:none;border:0;padding:0;font-size:14px;cursor:pointer}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(10,58,62,.07),0 6px 18px rgba(10,58,62,.06)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* request alert */
.alert{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--yellow);color:#3A2604;border:0;width:100%;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(246,195,67,.35)}
.alert b{font-size:17px;display:block}
.alert small{font-size:13px;opacity:.85}
.alert .chev{margin-left:auto}

/* today list */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;background:none;width:100%;text-align:left;cursor:pointer;min-height:56px}
.row + .row{border-top:1px solid #E7EEEF}
.row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--muted);font-size:13px}
.row .end{font-size:13px;color:var(--muted);text-align:right;flex-shrink:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.02em}
.tag.site{background:var(--teal-soft);color:var(--teal)}
.tag.booking{background:var(--booking-soft);color:var(--booking)}
.tag.direct{background:#E9EEDB;color:#4D5A1A}
.tag.pending{background:var(--yellow-soft);color:var(--yellow-ink)}
.tag.free{background:#EEE9F8;color:#5A45A8}

/* room grid */
.rooms{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.room{min-width:0;background:var(--card);border-radius:14px;padding:12px 12px 10px 14px;border:0;text-align:left;cursor:pointer;box-shadow:inset 4px 0 0 var(--acc,#B5C3C5),0 1px 3px rgba(10,58,62,.08);min-height:92px;display:flex;flex-direction:column;gap:4px}
.room.apt{grid-column:span 2}
.room .nm{font-weight:700;font-size:15px}
.room .st{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .dots{display:flex;gap:3px;margin-top:auto;padding-top:6px}
.room .dots i{flex:1;height:6px;border-radius:3px;background:#E3EAEB}
.room .dots i.b{background:var(--booking)} .room .dots i.d{background:var(--teal)} .room .dots i.p{background:var(--yellow)} .room .dots i.x{background:var(--red)} .room .dots i.f{background:var(--free)}

/* segmented */
.segbar{position:sticky;top:var(--top-h,64px);z-index:15;margin:0 -16px 12px;padding:6px 16px 10px;background:rgba(238,243,244,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg{display:flex;background:#DDE6E7;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;position:relative}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .n{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;margin-left:5px}

/* request list */
.req{display:block;width:100%;text-align:left;border:0;padding:14px 16px;cursor:pointer;background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:inset 4px 0 0 var(--yellow),0 1px 3px rgba(10,58,62,.08)}
.req .l1{display:flex;align-items:center;gap:8px}
.req .l1 b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-size:12px;font-weight:700;color:var(--yellow-ink);background:var(--yellow-soft);padding:3px 8px;border-radius:10px;white-space:nowrap}
.timer.hot{background:var(--red-soft);color:var(--red)}
.req .l2{font-size:14px;color:var(--muted);margin-top:3px}
.req .msg{margin-top:8px;font-size:14px;color:var(--ink);background:#F4F7F7;border-radius:10px;padding:8px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* thread list */
.thr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 16px;cursor:pointer;min-height:64px}
.thr + .thr{border-top:1px solid #E7EEEF}
.thr .ini{width:42px;height:42px;border-radius:21px;background:var(--teal-soft);color:var(--teal);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thr .main{flex:1;min-width:0}
.thr .main b{display:flex;gap:8px;align-items:baseline}
.thr .main b span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thr .main b small{font-weight:500;color:var(--muted);font-size:12px}
.thr .prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr.unread .prev{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:5px;background:var(--teal);flex-shrink:0}

/* ---------- calendar ---------- */
body.calmode{overflow:hidden}
body.calmode main{padding-bottom:0}
.cal-wrap{margin:0 -16px;background:var(--card);border-top:1px solid var(--line);position:relative;height:calc(100dvh - var(--top-h,64px) - 52px - var(--tab-h) - var(--safe-b));overflow:hidden}
.cal{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cal table{border-collapse:separate;border-spacing:0}
.cal th,.cal td{padding:0}
.cal .rh{position:sticky;left:0;z-index:3;background:var(--card);width:46px;min-width:46px;border-right:1px solid var(--line);text-align:center;box-shadow:3px 0 6px -4px rgba(0,0,0,.18)}
.cal tbody .rh{height:46px;font-size:16px;font-weight:700;color:var(--ink);border-bottom:1px solid #EEF2F3}
.cal tbody .rh small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-2px}
.cal tbody tr.apt .rh{font-size:12px}
.cal thead th{position:sticky;top:0;z-index:2;background:var(--card);height:48px;font-weight:600;font-size:11px;color:var(--muted);text-align:center;min-width:44px;width:44px;border-bottom:1px solid var(--line)}
.cal thead th.rh{z-index:4}
.cal thead th b{display:block;font-size:16px;color:var(--ink);font-weight:700;width:28px;height:28px;line-height:28px;border-radius:14px;margin:1px auto 0}
.cal thead th.today{color:var(--teal)}
.cal thead th.today b{background:var(--teal);color:#fff}
.cal thead th.we b{color:#8A9A9C}
.cal thead th.m1{box-shadow:inset 1.5px 0 0 var(--teal)}
.cal td.c{height:46px;min-width:44px;border-bottom:1px solid #EEF2F3;position:relative;cursor:pointer}
.cal td.c.we{background:#F7FAFA}
.cal td.c.tc{background:#EAF4F4}
.cal td.c.m1{box-shadow:inset 1.5px 0 0 rgba(15,82,87,.35)}
.cal tr.apt td,.cal tr.apt th{border-top:2px solid var(--line)}
.cal td.c.closed{background:var(--red)}
.cal td.c.closed::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600}
.cal td.c.sel{background:var(--teal-soft);box-shadow:inset 0 0 0 2px var(--teal)}
.bar{position:absolute;top:7px;bottom:7px;left:22px;z-index:1;border-radius:8px;color:#fff;font-size:11.5px;font-weight:600;padding:0 7px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar.cont{left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar.site,.bar.direct{background:var(--teal)}
.bar.booking{background:var(--booking)}
.bar.free{background:var(--free)}
.bar.pending{background:var(--yellow);color:#3A2604;animation:blink 1.4s ease-in-out infinite}
.bar.lifted{outline:3px solid var(--ink);outline-offset:1px}
@keyframes blink{50%{box-shadow:0 0 0 4px rgba(246,195,67,.45);opacity:.75}}
@media (prefers-reduced-motion:reduce){.bar.pending{animation:none}}
.cal-nav{display:flex;align-items:center;gap:6px;height:52px;margin:0}
.cal-nav .mon{flex:1;font-weight:700;font-size:17px;white-space:nowrap}
.cal-nav .pill{height:34px;padding:0 12px}
.cal-nav .pill.sq{width:34px;padding:0;justify-content:center;font-size:18px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:18px;height:36px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pendrow{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-top:-4px;scrollbar-width:none}
.pendrow::-webkit-scrollbar{display:none}
.pendrow .chip{flex-shrink:0;height:32px;font-size:13px;border-color:var(--yellow);background:var(--yellow-soft)}
.move-hint{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.move-hint button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:14px;height:30px;padding:0 12px;font-weight:600}
.cal td.c.target{background:#DDF0E3}
.cal td.c.notarget{background:#F7EFEE}
.cal-help{position:absolute;right:10px;bottom:10px;z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-nav{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.cal-nav .mon{flex:1;font-weight:700;font-size:17px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:18px;height:36px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.move-hint{position:sticky;top:calc(var(--safe-t) + 64px);z-index:6;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.move-hint button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:14px;height:30px;padding:0 12px;font-weight:600}
.cal td.c.target{background:#E5F3EA}
.cal td.c.notarget{background:#F7EFEE}

/* action bar above tabs */
.actbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + var(--safe-b) + 10px);z-index:30;background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .22s ease-out}
.actbar .what{flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.actbar .what b{display:block;font-size:15px}
.actbar button{border:0;border-radius:12px;height:40px;padding:0 12px;font-size:14px;white-space:nowrap;font-weight:700;cursor:pointer}
.actbar .x{background:transparent;color:#fff;width:36px;padding:0}
@keyframes up{from{transform:translateY(20px);opacity:0}}

/* ---------- bookings list ---------- */
.search{display:flex;gap:8px;margin:4px 0 12px}
.search input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;min-width:0}
.grp{margin-bottom:10px}
.grp > button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 4px;cursor:pointer;text-align:left}
.grp > button b{font-size:18px}
.grp > button small{color:var(--muted);font-size:13px;margin-left:auto}
.grp > button svg{transition:transform .2s}
.grp.open > button svg{transform:rotate(90deg)}
.mgrp > button{padding:10px 4px 8px}
.mgrp > button b{font-size:15px}
.bk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 16px;cursor:pointer;min-height:60px}
.bk + .bk{border-top:1px solid #E7EEEF}
.bk .d{width:44px;text-align:center;flex-shrink:0}
.bk .d b{display:block;font-size:19px;line-height:1.1}
.bk .d small{font-size:11px;color:var(--muted);text-transform:uppercase}
.bk .main{flex:1;min-width:0}
.bk .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .main small{color:var(--muted);font-size:13px}
.bk.cancel .main b{text-decoration:line-through;color:var(--muted)}

/* ---------- more ---------- */
.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(10,58,62,.07)}
.li{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:54px;width:100%;border:0;background:none;text-align:left;cursor:pointer;text-decoration:none;color:inherit}
.li + .li{border-top:1px solid #E7EEEF}
.li .ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li .ic svg{width:18px;height:18px}
.li span{flex:1}
.li small{color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:#C9D4D5;position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34A853}.sw.on::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--muted);padding:8px 4px 0}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);display:flex}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#7E8F91;cursor:pointer;position:relative;padding-top:4px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--teal)}
nav.tabs button.on svg *{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{30%{transform:scale(.82)}}
nav.tabs svg *{transform-origin:center;transform-box:fill-box}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;font-weight:700}
@media (prefers-reduced-motion:reduce){nav.tabs button.on svg *{animation:none}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,30,32,.38);opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet .grab{padding:10px 0 4px;display:flex;justify-content:center;touch-action:none;cursor:grab}
.sheet .grab i{width:40px;height:5px;border-radius:3px;background:#C9D4D5}
.sheet .hd{padding:4px 20px 10px;display:flex;align-items:flex-start;gap:10px}
.sheet .hd h2{margin:0;font-size:21px;flex:1;letter-spacing:-.01em}
.sheet .hd p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sheet .bd{overflow-y:auto;padding:0 20px 16px;-webkit-overflow-scrolling:touch}
.sheet .ft{padding:12px 20px calc(12px + var(--safe-b));border-top:1px solid #E7EEEF;display:flex;gap:10px}
.full{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.full.show{transform:none}
.full .top{background:var(--bg)}
.full .bd{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.full .ft{padding:12px 16px calc(12px + var(--safe-b));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15px;margin:6px 0 4px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.kv dd a{color:var(--teal);text-decoration:none}
.bubble{background:#F4F7F7;border-radius:14px;padding:12px 14px;font-size:15px;white-space:pre-wrap;margin:8px 0}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px}
textarea.field{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;height:38px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip:disabled{opacity:.4;cursor:not-allowed}

.btn{flex:1;height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}

function priceFor(night) {
  const o = S.prices;
  if (o[night]) return o[night];
  const y = Number(night.slice(0, 4)), md = night.slice(4);
  for (let yy = y - 1; yy >= y - 6; yy--) { const v = o[yy + md] || (md === '-02-29' ? o[yy + '-02-28'] : null); if (v) return v; }

function stayPrice(type, start, nights, guests) {
  let sum = 0;
  for (let i = 0; i < nights; i++) {
    const p = priceFor(add(start, i));
    const v = p && !p.closed ? (type === 'apt' ? p.apt : p.room) : null;
    if (v == null) return null;
    sum += Number(v) + (type === 'room' && guests > 2 ? S.extra * (guests - 2) : 0);
  }
  return sum;
}

/* ================= overlays ================= */
let overlay = null; // { kind, id, el }
function closeOverlay() {
  if (!overlay) return;
  const o = overlay; overlay = null;
  o.el.classList.remove('show'); if (o.scrim) o.scrim.classList.remove('show');
  setTimeout(() => { o.el.remove(); if (o.scrim) o.scrim.remove(); }, 300);
  document.body.style.overflow = '';
}
function sheet(html, kind, id) {
  closeOverlayNow();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = '<div class="grab"><i></i></div>' + html;
  $('#layer').append(scrim, el);
  overlay = { kind: kind, id: id, el: el, scrim: scrim };
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { scrim.classList.add('show'); el.classList.add('show'); });
  scrim.addEventListener('click', closeOverlay);
  dragToClose(el);
  return el;
}
function full(html, kind, id) {
  closeOverlayNow();
  const el = document.createElement('div'); el.className = 'full'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = html;
  $('#layer').append(el);
  overlay = { kind: kind, id: id, el: el };
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => el.classList.add('show'));
  return el;
}
function closeOverlayNow() { if (!overlay) return; overlay.el.remove(); if (overlay.scrim) overlay.scrim.remove(); overlay = null; document.body.style.overflow = ''; }
function dragToClose(el) {
  const g = el.querySelector('.grab'); let y0 = null, dy = 0;
  g.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; el.style.transition = 'none'; }, { passive: true });
  g.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); el.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
  g.addEventListener('touchend', () => { el.style.transition = ''; el.style.transform = ''; if (dy > 90) closeOverlay(); y0 = null; });
}
/* re-draw an open panel after data changes */
function refreshOverlay() {
  if (!overlay) return;
  const k = overlay.kind, id = overlay.id;
  if (k === 'req') { const b = all().find(x => x.id === id); if (!b || b.status !== 'pending') { closeOverlay(); return; } }
  if (k === 'thread') { const st = overlay.el.querySelector('.chat'); if (st) { st.innerHTML = chatHTML(id); const bd = overlay.el.querySelector('.bd'); bd.scrollTop = bd.scrollHeight; } return; }
  if (k === 'booking') { const b = all().find(x => x.id === id); if (!b) { closeOverlay(); return; } const keep = overlay.el; keep.querySelector('.content').innerHTML = bookingHTML(b); return; }
}

        (b.promo ? '<dt>Κουπόνι</dt><dd>' + esc(b.promo) + ' · −' + b.pct + '%</dd>' : '') +
        '<dt>Τηλέφωνο</dt><dd><a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + '</a></dd>' +

      '</dl></div>' +

      (free.length ? '<div class="chips" id="units">' + fits.map(u => '<button class="chip' + (u.id === pickUnit ? ' on' : '') + '" data-unit="' + u.id + '"' + (free.some(f => f.id === u.id) ? '' : ' disabled') + '>' + u.short + '</button>').join('') + '</div><p class="note">Τα γκρι είναι πιασμένα εκείνες τις μέρες ή δεν χωράνε ' + b.guests + ' άτομα.</p>'
                   : '<div class="card empty" style="color:var(--red)">Δεν υπάρχει ελεύθερο ' + (b.type === 'apt' ? 'διαμέρισμα' : 'δωμάτιο') + ' για αυτές τις μέρες.</div>') +
    '</div>' +
    '<div class="ft"><button class="btn danger" data-act="reject" data-id="' + b.id + '">Απόρριψη</button><button class="btn ok" data-act="accept" data-id="' + b.id + '"' + (free.length ? '' : ' disabled') + '>Αποδοχή</button></div>', 'req', id);
  el.querySelectorAll('[data-unit]').forEach(c => c.addEventListener('click', () => {
    if (c.disabled) return; pickUnit = c.dataset.unit;
    el.querySelectorAll('[data-unit]').forEach(x => x.classList.toggle('on', x === c));

function decide(id, status) {
  const b = all().find(x => x.id === id); if (!b) return;
  if (status === 'confirmed' && !pickUnit) { toast('Διάλεξε δωμάτιο πρώτα.'); return; }
  if (status === 'rejected' && !confirm('Απόρριψη του αιτήματος του/της ' + b.name + ';\nΘα του/της σταλεί email.')) return;
  const row = { status: status, decided_at: new Date().toISOString(), decided_by: by() };
  if (status === 'confirmed') row.unit = pickUnit;
  write(() => SB.from('booking_requests').update(row).eq('id', b.dbId).eq('status', 'pending').select('id'), () => {
    b.status = status; if (row.unit) b.unit = row.unit; b.by = by();
    closeOverlay();
    toast(status === 'confirmed' ? 'Έγινε αποδοχή: ' + b.name + ' στο ' + unitName(b.unit) + '. Στάλθηκε email επιβεβαίωσης.' : 'Το αίτημα απορρίφθηκε.');
  });
}

      '<div style="display:flex;gap:10px"><div style="flex:0 0 96px"><label class="lbl">Άτομα</label><input class="field" type="number" name="guests" min="1" max="' + u.cap + '" value="' + Math.min(2, u.cap) + '" inputmode="numeric"></div><div style="flex:1"><label class="lbl">Τηλέφωνο</label><input class="field" type="tel" name="phone" inputmode="tel"></div></div>' +
      '<label class="lbl">Είδος</label><div class="chips" id="kinds"><button type="button" class="chip on" data-k="paid">Πληρωμένη</button><button type="button" class="chip" data-k="free">Δωρεάν (φίλοι)</button></div>' +
      '<div id="paybox"><div style="display:flex;gap:10px"><div style="flex:1"><label class="lbl">Ποσό (€)</label><input class="field" type="number" name="total" min="0" step="1" inputmode="decimal" placeholder="—"></div><div style="flex:1"><label class="lbl">Πληρωμή</label><select class="field" name="pay"><option value="cash">Μετρητά</option><option value="card">Κάρτα</option><option value="bank">Τράπεζα</option></select></div></div><p class="note" id="psug"></p></div>' +
      '<label class="lbl">Σημείωση</label><textarea class="field" name="note" rows="2"></textarea>' +
      '<div class="err" id="nerr"></div>' +
    '</form></div><div class="ft"><button class="btn pri" data-act="save-new">Αποθήκευση</button></div>';
  const el = sheet(h, 'new', null);
  let kind = 'paid';
  const f = el.querySelector('#nf');
  const sug = () => {
    const un = f.unit.value, n = diff(f.start.value, f.end.value);
    const p = n > 0 ? stayPrice(un === 'apt' ? 'apt' : 'room', f.start.value, n, Number(f.guests.value) || 1) : null;
    el.querySelector('#psug').textContent = p != null ? 'Τιμή σάιτ για ' + n + ' νύχτες: ' + money(p) : '';
    f.guests.max = UNITS.find(x => x.id === un).cap;
  };
  ['unit', 'start', 'end', 'guests'].forEach(k => f[k].addEventListener('change', sug)); sug();
  el.querySelectorAll('[data-k]').forEach(c => c.addEventListener('click', () => { kind = c.dataset.k; el.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('on', x === c)); el.querySelector('#paybox').hidden = kind === 'free'; }));
  el.querySelector('[data-act="save-new"]').onclick = () => {
    const err = el.querySelector('#nerr'); err.textContent = '';
    const un = f.unit.value, s = f.start.value, e = f.end.value, g = Number(f.guests.value), nm = f.name.value.trim();
    const uu = UNITS.find(x => x.id === un);
    if (!nm) { err.textContent = 'Γράψε το ονοματεπώνυμο.'; f.name.focus(); return; }
    if (!s || !e || e <= s) { err.textContent = 'Η αναχώρηση πρέπει να είναι μετά την άφιξη.'; return; }
    if (!(g >= 1 && g <= uu.cap)) { err.textContent = 'Το ' + uu.name + ' χωράει ως ' + uu.cap + ' άτομα.'; return; }
    if (!isFree(un, s, e)) { err.textContent = 'Το ' + uu.name + ' δεν είναι ελεύθερο όλες αυτές τις μέρες.'; return; }
    let total = 0;
    if (kind === 'paid') {
      total = f.total.value === '' ? stayPrice(un === 'apt' ? 'apt' : 'room', s, diff(s, e), g) : Number(f.total.value);
      if (total == null) { err.textContent = 'Γράψε ποσό: δεν υπάρχει τιμή για αυτές τις μέρες.'; f.total.focus(); return; }
    }
    const row = { kind: kind, source: 'direct', unit_type: un === 'apt' ? 'apt' : 'room', unit: un, check_in: s, check_out: e, guests: g, name: nm, phone: f.phone.value.trim(), note: f.note.value.trim(), total: total, pay: kind === 'paid' ? f.pay.value : null, created_by: by(), decided_by: 'Καταχώριση · ' + by() };
    write(() => SB.from('owner_stays').insert(row).select('id'), () => {
      S.stays.push(fromStay(Object.assign({ id: 'new' + Date.now(), created_at: new Date().toISOString(), status: 'confirmed', email: '' }, row)));
      S.sel = null; closeOverlay(); toast('Αποθηκεύτηκε: ' + nm + ', ' + uu.name + ', ' + range(s, e) + '.');
    });
  };
}

/* ================= push ================= */
function b64(s) { const p = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4); const b = atob(p); const o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
const PUSH = {
  OFF: 'lm-admin-push-off',
  ios: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  standalone: (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,
  supported() { return 'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window; },
  perm() { return this.supported() ? Notification.permission : 'unsupported'; },
  wantsOff() { try { return localStorage.getItem(this.OFF) === '1'; } catch (e) { return false; } },
  setOff(v) { try { v ? localStorage.setItem(this.OFF, '1') : localStorage.removeItem(this.OFF); } catch (e) {} },
  on() { return this.perm() === 'granted' && !this.wantsOff(); },
  ready() { return navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready); },
  sync() {
    if (DEMO || !SB || !this.on()) return Promise.resolve(false);
    return this.ready().then(reg => SB.functions.invoke('push', { body: { action: 'key' } }).then(res => {
      if (res.error || !res.data || !res.data.publicKey) throw new Error('key');
      const key = b64(res.data.publicKey);
      return reg.pushManager.getSubscription().then(old => {
        const k = old && old.options && old.options.applicationServerKey ? new Uint8Array(old.options.applicationServerKey) : null;
        if (old && (!k || k.length !== key.length || k.some((x, i) => x !== key[i]))) return old.unsubscribe().then(() => null);
        return old;
      }).then(old => old || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
    })).then(sub => { const j = sub.toJSON(); return SB.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: navigator.userAgent }); })
      .then(r => { if (r.error) throw r.error; return true; });
  },
  stop() {
    if (!this.supported()) return Promise.resolve();
    return this.ready().then(reg => reg.pushManager.getSubscription()).then(sub => {
      if (!sub) return;
      return Promise.resolve(SB ? SB.rpc('delete_push_subscription', { p_endpoint: sub.endpoint }) : null).then(() => sub.unsubscribe());
    }).catch(() => {});
  },
  toggle() {
    if (!this.supported()) { toast(this.ios ? 'Πρόσθεσε πρώτα την εφαρμογή στην οθόνη Αφετηρίας και άνοιξέ την από εκεί.' : 'Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις.'); return; }
    if (this.on()) { this.setOff(true); this.stop(); render(); toast('Οι ειδοποιήσεις έκλεισαν σε αυτή τη συσκευή.'); return; }
    Notification.requestPermission().then(p => {
      if (p !== 'granted') { render(); toast('Δεν δόθηκε άδεια για ειδοποιήσεις.'); return; }
      this.setOff(false); render();
      if (DEMO) { this.ready().then(reg => reg.showNotification('Νέο αίτημα κράτησης', { body: 'Ελένη Σταύρου · 4 νύχτες · 2 άτομα', icon: 'icons/admin-192.png', data: { url: 'admin-mobile.html?demo=1&req=qd1' } })); return; }
      this.sync().then(() => toast('Θα σου έρχεται ειδοποίηση σε κάθε νέο αίτημα.'), () => toast('Δεν ενεργοποιήθηκαν. Δοκίμασε ξανά.'));
    });
  }
};

/* ================= toast ================= */
let toastT = null;
function toast(msg) {
  const host = $('#toast-host'); clearTimeout(toastT);
  host.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  toastT = setTimeout(() => { host.innerHTML = ''; }, 3800);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-cell]');
  if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  if (t.dataset.cell && !t.dataset.act) { const p = t.dataset.cell.split('|'); cellTap(p[0], p[1]); return; }
  const a = t.dataset.act, id = t.dataset.id;
  if (S.move && t.classList.contains('bar')) { const cell = t.closest('td'); if (cell) { const p = cell.dataset.cell.split('|'); cellTap(p[0], p[1]); } return; }
  switch (a) {
    case 'open-req': openReq(id); break;
    case 'booking': openBooking(id); break;
    case 'room': openRoom(id); break;
    case 'thread': openThread(id); break;
    case 'close': closeOverlay(); break;
    case 'seg': S.inboxSeg = id; render(); break;
    case 'accept': decide(id, 'confirmed'); break;
    case 'reject': decide(id, 'rejected'); break;
    case 'delete': delBooking(id); break;
    case 'move': closeOverlay(); S.tab = 'cal'; S.move = id; S.sel = null; { const b = all().find(x => x.id === id); if (b && (b.start < S.calStart || b.start >= add(S.calStart, CAL_DAYS))) { S.calStart = b.start < S.today ? S.today : b.start; S.calScroll = 0; } } render(); toast('Πάτα το δωμάτιο όπου πάει η κράτηση.'); break;
    case 'move-cancel': S.move = null; render(); break;
    case 'send': sendMsg(id); break;
    case 'new': openNew({}); break;
    case 'new-sel': { const a1 = S.sel.b ? (S.sel.a < S.sel.b ? S.sel.a : S.sel.b) : S.sel.a, z = S.sel.b ? (S.sel.a < S.sel.b ? S.sel.b : S.sel.a) : S.sel.a; openNew({ unit: S.sel.unit, start: a1, end: add(z, 1) }); break; }
    case 'close-days': setClosed(true); break;
    case 'reopen': setClosed(false); break;
    case 'cal-info': calInfo(); break;
    case 'sel-clear': S.sel = null; render(); break;
    case 'cal-prev': S.calStart = add(S.calStart, -14); if (S.calStart < add(S.today, -60)) S.calStart = add(S.today, -60); S.calScroll = 0; S.calScrollY = S.calScrollY || 0; render(); break;
    case 'cal-next': S.calStart = add(S.calStart, 28); S.calScroll = 0; S.calScrollY = S.calScrollY || 0; render(); break;
    case 'cal-today': S.calStart = S.today; S.calScroll = 0; S.calScrollY = S.calScrollY || 0; render(); break;
    case 'tog': S.open[id] = !t.parentNode.classList.contains('open'); render(); break;
    case 'sort': S.sort = S.sort === 'date' ? 'name' : 'date'; render(); break;
    case 'push': PUSH.toggle(); break;
    case 'logout': if (confirm('Αποσύνδεση από αυτή τη συσκευή;')) logout(); break;
  }
});
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
window.addEventListener('scroll', () => { const tp = $('#top'); if (tp) tp.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
window.addEventListener('popstate', () => { if (overlay) closeOverlay(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  if (!e.data || !e.data.open || !S.user) return;
  try { const id = new URL(e.data.open).searchParams.get('req'); if (id) openFromPush(id); } catch (err) {}
});
function openFromPush(id) {
  const tryOpen = () => { const b = all().find(x => x.dbId === id || x.id === id || x.id === 'q' + id); if (b) { S.tab = 'inbox'; S.inboxSeg = 'req'; render(); openReq(b.id); return true; } return false; };
  if (!tryOpen()) load().then(tryOpen);
}

/* ================= auth ================= */
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; }
function enter(user) {
  S.user = user;
  $('#login').hidden = true; $('#app').hidden = false;
  render();
  if (DEMO) { demoData(); render(); }
  else { load().then(() => { const r = params.get('req'); if (r) openFromPush(r); }); live(); PUSH.sync().catch(() => {}); }
  if (DEMO && params.get('req')) setTimeout(() => openFromPush(params.get('req')), 50);
}
function profile(u) {
  return SB.from('owners').select('email, name').eq('email', u.email).maybeSingle().then(r => {
    if (r.error || !r.data) throw new Error('Αυτό το email δεν είναι στους ιδιοκτήτες.');
    return { email: r.data.email, name: r.data.name || r.data.email };
  });
}
function logout() {
  if (DEMO) { location.href = 'admin-mobile.html'; return; }
  PUSH.stop().then(() => SB.auth.signOut()).then(() => { S.user = null; S.loaded = false; if (channel) SB.removeChannel(channel); showLogin(); });
}
$('#lf').addEventListener('submit', e => {
  e.preventDefault();
  const go = $('#lgo'), er = $('#lerr'); er.textContent = ''; go.disabled = true; go.textContent = 'Σύνδεση…';
  if (!SB) { er.textContent = 'Δεν υπάρχει σύνδεση με τον server.'; go.disabled = false; go.textContent = 'Σύνδεση'; return; }
  SB.auth.signInWithPassword({ email: $('#le').value.trim().toLowerCase(), password: $('#lp').value }).then(r => {
    if (r.error) throw new Error(/invalid login/i.test(r.error.message) ? 'Λάθος email ή κωδικός.' : /fetch|network/i.test(r.error.message) ? 'Δεν υπάρχει σύνδεση στο ίντερνετ.' : r.error.message);
    return profile(r.data.user);
  }).then(enter, err => { er.textContent = err.message; $('#lp').value = ''; }).then(() => { go.disabled = false; go.textContent = 'Σύνδεση'; });
});

if (DEMO) enter({ email: 'demo@example.com', name: 'Στάθης' });
else {
  // same saved sign-in as the desktop admin, so an owner already signed in there is signed in here too
  const store = {
    getItem: k => { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } },
    setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
    removeItem: k => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
  };
  SB = window.supabase.createClient(LM_API, LM_KEY, { auth: { storage: store, storageKey: 'lm-admin-auth', persistSession: true, autoRefreshToken: true } });
  SB.auth.getSession().then(r => r.data && r.data.session ? profile(r.data.session.user).then(enter) : showLogin()).catch(showLogin);
}
})();
