<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Life's Moments · Extranet (προεπισκόπηση)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&amp;family=GFS+Didot&amp;display=swap" rel="stylesheet">
<!--
  Admin preview laid out like a hotel extranet (Booking.com style structure):
  top bar + horizontal menu, home with "needs attention" and arrivals/departures,
  a rates & availability calendar per room type with drag-to-select and an edit
  panel, a reservations table, inbox, reviews, finance, analytics, property.
  Same fake data as admin.html, which stays untouched.
-->
<style>
:root{
  --top:#0A3A3E; --nav:#0F5257; --pri:#0F5257; --pri-h:#0A3A3E; --link:#0F6B72;
  --bg:#F2F5F5; --card:#FFFFFF; --line:#DCE3E4; --line2:#EDF1F2; --ink:#18282B; --mute:#5B6B6E; --soft:#F7F9F9;
  --ok:#1E7B3A; --okbg:#E7F4EA; --bad:#B42318; --badbg:#FDECEA; --warn:#9A4A06; --warnbg:#FEF3E2;
  --gold:#C9A44C; --sel:#D8ECEE; --bk:#3B5B8C; --site:#0F8A87;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Commissioner,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a,.lnk{color:var(--link);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit}
a:hover,.lnk:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:24px;font-weight:600;margin:0}
h2{font-size:18px;font-weight:600;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.mute{color:var(--mute)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--top);color:#fff}
.top .in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand b{font-family:"GFS Didot",serif;font-weight:400;font-size:24px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.75}
.top .sp{flex:1}
.top .ic{display:flex;align-items:center;gap:6px}
.top .ic button{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;height:32px;padding:0 10px;font-size:13px;cursor:pointer}
.top .ic button:hover{background:rgba(255,255,255,.1)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#0A3A3E;display:grid;place-items:center;font-weight:700;font-size:13px}

/* nav */
.nav{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.nav .in{max-width:1320px;margin:0 auto;padding:0 12px;display:flex;overflow-x:auto;scrollbar-width:none}
.nav .in::-webkit-scrollbar{display:none}
.ni{position:relative;flex:none}
.ni>button{height:46px;padding:0 14px;background:transparent;border:0;color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent;white-space:nowrap}
.ni>button:hover{background:rgba(255,255,255,.08)}
.ni.on>button{border-bottom-color:var(--gold);font-weight:600}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#D92D20;color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.car{font-size:10px;opacity:.8}
.dd{display:none;position:fixed;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 8px 28px rgba(10,58,62,.22);padding:6px;min-width:220px;z-index:40}
.dd button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:transparent;border-radius:6px;cursor:pointer;font-size:14px}
.dd button:hover{background:var(--soft)}
.dd button.cur{font-weight:600;color:var(--pri)}
.dd.show{display:block}

/* layout */
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px 120px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph .sp{flex:1}
.crumb{font-size:12px;color:var(--mute);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card>.hd{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card>.hd .sp{flex:1}
.card>.bd{padding:16px 18px}
.grid{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.col-main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px}

/* buttons, inputs */
.btn{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--pri-h)}
.btn.sec{background:#fff;color:var(--pri)}
.btn.sec:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--bad);border-color:#F1B8B2}
.btn.danger:hover{background:var(--badbg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.inp,select.inp,textarea.inp{height:36px;padding:0 10px;border:1px solid #BCCBCD;border-radius:6px;background:#fff;min-width:0}
textarea.inp{height:auto;padding:9px 10px;resize:vertical;width:100%;line-height:1.45}
.inp:focus,.btn:focus-visible,.ni>button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--mute)}
label.f .inp{font-size:14px;font-weight:400;color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-bad{background:var(--badbg);color:var(--bad)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-neu{background:var(--line2);color:var(--mute)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.src i{width:8px;height:8px;border-radius:50%;display:inline-block}
.src.bk i{background:var(--bk)} .src.site i{background:var(--site)}

/* attention */
.att{display:flex;flex-wrap:wrap;gap:12px}
.att .a{flex:1 1 230px;min-width:0;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:4px}
.att .a.ok{border-left-color:var(--ok)} .att .a.info{border-left-color:var(--link)}
.att .a b{font-size:15px}
.att .a .lnk{align-self:flex-start;margin-top:2px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:11px 14px;cursor:pointer;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--pri)}
.seg{display:inline-flex;border:1px solid #BCCBCD;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;height:30px;padding:0 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:#F4F9F9}
.t td.r,.t th.r{text-align:right}
.t td.num{white-space:nowrap}
.t tfoot td{font-weight:600;background:var(--soft);border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--mute)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff}
.kpi .v{font-size:22px;font-weight:600;margin-top:2px}
.kpi .d{font-size:12px;color:var(--mute)}

/* calendar */
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff;user-select:none;-webkit-user-select:none}
table.cal{border-collapse:separate;border-spacing:0;font-size:13px}
.cal th,.cal td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0;text-align:center;min-width:62px;height:38px}
.cal .lab{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:0 14px;min-width:200px;max-width:200px;font-weight:500;border-right:1px solid var(--line)}
.cal thead th{background:var(--soft);font-weight:500;height:50px;position:relative}
.cal thead th .dw{font-size:11px;color:var(--mute);display:block}
.cal thead th .dn{font-size:15px;font-weight:600}
.cal thead th.we{background:#EEF2F3}
.cal thead th.today{background:var(--pri);color:#fff}
.cal thead th.today .dw{color:#D7E8EA}
.cal tr.tyh td{background:#F0F5F5;height:44px}
.cal tr.tyh td.lab{background:#F0F5F5;font-weight:600;font-size:14px}
.cal tr.tyh td.fill{text-align:left;padding:0 14px;color:var(--mute);font-size:12px}
.cal td.c{cursor:cell;position:relative}
.cal td.c.we{background:#FAFBFB}
.cal td.c.past{color:#9AA7A9;background:repeating-linear-gradient(-45deg,#fff 0 6px,#F5F7F7 6px 12px)}
.cal td.c.selc{background:var(--sel)!important;box-shadow:inset 0 0 0 1px #9CCBCF}
.cal td.c:hover{background:#EAF4F5}
.st{display:block;margin:6px 5px;height:24px;line-height:24px;border-radius:4px;font-size:11px;font-weight:700;border:0;width:calc(100% - 10px);cursor:pointer}
.st.open{background:#CFEBD7;color:#14532D}
.st.closed{background:#F6C9C4;color:#7A1A10}
.st.sold{background:#E3E7E8;color:#4A5B5E}
.cal .pend{color:var(--warn);font-size:11px;font-weight:700;margin-left:3px}
.cal .ovr{color:var(--gold);font-weight:700}
.cal .lab small{display:block;color:var(--mute);font-weight:400;font-size:11px;line-height:1.2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,30,32,.32);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:51;box-shadow:-8px 0 30px rgba(10,58,62,.18);display:flex;flex-direction:column}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer .dh .sp{flex:1;min-width:0}
.drawer .db{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.kv div span{display:block;font-size:12px;color:var(--mute)}
.kv div b{font-weight:600}
.note{background:var(--warnbg);border-radius:6px;padding:10px 12px;color:#5A3305}
.info{background:#EAF3F4;border-radius:6px;padding:10px 12px;color:#0F4A4E;font-size:13px}
.radio{display:flex;gap:8px}
.radio label{flex:1;border:1px solid #BCCBCD;border-radius:6px;padding:9px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.radio label.on{border-color:var(--pri);background:#F0F7F7;font-weight:600}
.err{color:var(--bad);font-size:13px}

/* inbox */
.inbox{display:flex;min-height:560px}
.inbox .list{flex:0 0 320px;border-right:1px solid var(--line);overflow-y:auto;max-height:680px}
.inbox .th{padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.inbox .th:hover{background:var(--soft)}
.inbox .th.on{background:#EAF4F5;box-shadow:inset 3px 0 0 var(--pri)}
.inbox .th .r1{display:flex;gap:8px;align-items:center}
.inbox .th .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.inbox .th.un .r1 b{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#D92D20;flex:none}
.inbox .th .pv{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox .conv{flex:1;min-width:0;display:flex;flex-direction:column}
.conv .ch{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.conv .ms{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:440px;background:var(--soft)}
.msg{max-width:78%;padding:10px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);white-space:pre-wrap}
.msg.host{align-self:flex-end;background:#E2F0F1;border-color:#C7DFE1}
.msg small{display:block;font-size:11px;color:var(--mute);margin-top:4px}
.conv .rp{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:14px;border:1px solid #BCCBCD;background:#fff;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--pri);color:var(--pri)}

/* reviews */
.score{display:flex;align-items:center;gap:14px}
.score .big{width:56px;height:56px;border-radius:8px 8px 8px 0;background:var(--top);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 28px}
.bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .tr{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--pri)}
.rv{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;gap:16px;flex-wrap:wrap}
.rv .who{flex:0 0 180px;font-size:13px}
.rv .who b{font-size:14px;display:block}
.rv .tx{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px}
.rv .sc{width:34px;height:34px;border-radius:6px 6px 6px 0;background:var(--top);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.pos::before{content:"+";color:var(--ok);font-weight:700;margin-right:8px}
.neg::before{content:"–";color:var(--bad);font-weight:700;margin-right:8px}
.reply{border-left:3px solid var(--pri);padding:6px 12px;background:var(--soft);font-size:13px}

/* analytics bars */
.chart{display:flex;align-items:flex-end;gap:3px;height:200px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column-reverse;min-width:6px;height:100%;position:relative}
.chart .c i{display:block;width:100%}
.chart .c:hover{opacity:.8}
.axis{display:flex;gap:3px;font-size:10px;color:var(--mute);margin-top:4px}
.axis span{flex:1;text-align:center;min-width:6px}

/* photos */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.phc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.phc .im{aspect-ratio:4/3;background:#DDE5E6 center/cover no-repeat;position:relative}
.phc .im .pill{position:absolute;left:8px;top:8px;background:var(--gold);color:#1C1A12}
.phc .ft{padding:8px 10px;display:flex;align-items:center;gap:6px;font-size:13px}
.phc .ft span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--top);color:#fff;padding:12px 18px;border-radius:8px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
#preview-bar{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:22px;background:#fff;box-shadow:0 4px 18px rgba(10,58,62,.18);font-size:12px;color:var(--mute);max-width:calc(100% - 32px)}
#preview-bar a{height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:15px;border:1px solid #BCCBCD;font-weight:600;color:var(--pri)}

@media (max-width:760px){
  .wrap{padding:16px 16px 110px}
  .top .in{padding:10px 16px}
  .brand span{display:none}
  .top .ic .hide-s{display:none}
  .inbox{flex-direction:column}
  .inbox .list{flex:none;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}
  .msg{max-width:92%}
  .kv{grid-template-columns:1fr 1fr}
  .cal .lab{min-width:132px;max-width:132px;padding:0 10px}
  .rv .who{flex:1 1 100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><b>Life's Moments</b><span>Λιμενάρια, Θάσος · 11 δωμάτια + διαμέρισμα</span></div>
    <div class="sp"></div>
    <div class="ic">
      <button type="button" class="hide-s" data-act="toast" data-msg="Η αναζήτηση κρατήσεων είναι στην καρτέλα Κρατήσεις">Αναζήτηση</button>
      <button type="button" class="hide-s" data-act="toast" data-msg="Ελληνικά · English (σύντομα)">EL</button>
      <div class="avatar" title="Ιδιοκτήτης">ΙΔ</div>
    </div>
  </div>
</header>
<nav class="nav" aria-label="Κύριο μενού"><div class="in" id="nav"></div></nav>
<div class="dd" id="dd" role="menu"></div>
<main class="wrap" id="view"></main>
<div id="layer"></div>
<div id="preview-bar"><span>Προεπισκόπηση · ψεύτικα δεδομένα</span><a href="admin.html">Το άλλο admin</a></div>

<script>
'use strict';
/* ---------- dates & formatting ---------- */
const TODAY = '2026-07-14';
const DAY = ['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'];
const MON = ['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const MONF = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const dt = s => { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); };
const iso = d => d.toISOString().slice(0,10);
const add = (s,n) => { const d = dt(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const diff = (a,b) => Math.round((dt(b)-dt(a))/864e5);
const fmt = s => { const d = dt(s); return d.getUTCDate()+' '+MON[d.getUTCMonth()]; };
const fmtY = s => fmt(s)+' '+s.slice(0,4);
const fmtD = s => { const d = dt(s); return DAY[d.getUTCDay()]+' '+fmt(s); };
const money = n => '€'+Math.round(n).toLocaleString('el-GR');
const money2 = n => '€'+n.toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthDays = ym => { const [y,m] = ym.split('-').map(Number); const n = new Date(Date.UTC(y,m,0)).getUTCDate(); return Array.from({length:n},(_,i)=>ym+'-'+String(i+1).padStart(2,'0')); };

/* ---------- derived ---------- */
const end = b => add(b.start, b.nights);
const byId = id => S.bookings.find(b => b.id === id);
const confirmed = () => S.bookings.filter(b => b.status === 'confirmed');
const pending = () => S.bookings.filter(b => b.status === 'pending');
const unread = () => S.threads.filter(t => t.unread).length;
const ref = b => b.source === 'booking' ? String(4100000000 + Number(b.id.replace(/\D/g,'')) * 7919301 % 899999999) : 'LM-' + String(2600 + Number(b.id.replace(/\D/g,'')) + (b.id[0]==='p'?40:b.id[0]==='c'?80:0));
const commission = b => b.source === 'booking' && b.status !== 'cancelled' ? b.total * COMMISSION : 0;

function seasonFor(date){
  const md = date.slice(5);
  for (const id of ['peak','high','low']) { const s = S.seasons.find(x=>x.id===id); if (s && s.ranges.some(r=>r[0]<=md && md<=r[1])) return s; }
  return null;
}
function occ(unit, date, ignore){
  const b = S.bookings.find(x => x.id!==ignore && x.status==='confirmed' && x.unit===unit && x.start<=date && date<end(x));
  if (b) return b;
  return S.blocks[unit+'|'+date] ? 'block' : null;
}
const isFree = (unit, start, nights, ignore) => { for (let i=0;i<nights;i++) if (occ(unit, add(start,i), ignore)) return false; return true; };
function candidates(b){
  if (b.type==='apt') return UNITS.filter(u=>u.id==='apt');
  return UNITS.filter(u=>u.type==='room' && u.cap>=b.guests).sort((a,c)=>a.cap-c.cap||a.n-c.n);
}
function booked(type, date){ return confirmed().filter(b => b.type===type && b.start<=date && date<end(b)).length; }
function pendingOn(type, date){ return pending().filter(b => b.type===type && b.start<=date && date<end(b)).length; }
function blockedUnits(type, date){ return UNITS.filter(u => u.type===type && S.blocks[u.id+'|'+date]).length; }
function day(type, date){
  const o = S.ov[type+'|'+date] || {};
  const se = seasonFor(date);
  const t = TYPES.find(x=>x.id===type);
  const base = {
    closed: se ? false : true,
    toSell: t.units - blockedUnits(type, date),
    price: se ? se[type] : null,
    min: se ? se.min : null
  };
  const r = Object.assign({}, base, o);
  r.isOv = 'price' in o || 'min' in o;
  r.booked = booked(type, date);
  r.pend = pendingOn(type, date);
  r.left = Math.max(0, r.toSell - r.booked);
  return r;
}

function openMenu(btn, id){
  const dd = document.getElementById('dd');
  if (dd.classList.contains('show') && dd.dataset.for === id) { closeMenu(); return; }
  const m = MENU.find(x=>x.id===id);
  dd.innerHTML = m.sub.map(s => `<button type="button" role="menuitem" data-act="go" data-id="${s.id}" class="${S.page===s.id?'cur':''}">${s.t}</button>`).join('');
  const r = btn.getBoundingClientRect();
  dd.style.top = (r.bottom + 4) + 'px';
  dd.style.left = Math.min(r.left, window.innerWidth - 236) + 'px';
  dd.dataset.for = id;
  dd.classList.add('show');
}

function openEditor(type, a, z){
  if (a > z) [a,z] = [z,a];
  if (a < TODAY) a = TODAY;
  if (z < a) { say('Οι περασμένες μέρες δεν αλλάζουν'); return; }
  S.sel = {type, a, z};
  const ds = []; for (let d=a; d<=z; d=add(d,1)) ds.push(day(type,d));
  const same = k => ds.every(x => x[k]===ds[0][k]) ? ds[0][k] : '';
  S.form = { closed: same('closed')===''? '' : (ds[0].closed?'1':'0'), toSell: same('toSell'), price: same('price')==null?'':same('price'), min: same('min')==null?'':same('min') };
  S.formErr = '';
  render();
}
function vEditor(){
  const {type,a,z} = S.sel, t = TYPES.find(x=>x.id===type), n = diff(a,z)+1;
  let maxBooked = 0; for (let d=a; d<=z; d=add(d,1)) maxBooked = Math.max(maxBooked, booked(type,d));
  const f = S.form;
  return `<div class="scrim" data-act="closeed"></div><aside class="drawer" role="dialog" aria-label="Επεξεργασία ημερών">
    <div class="dh"><div class="sp"><div class="crumb">${t.name}</div><h2>${a===z?fmtD(a):fmt(a)+' – '+fmt(z)}</h2><div class="mute small">${n} ${n===1?'μέρα':'μέρες'} · έως ${maxBooked} ήδη κρατημένα</div></div><button class="x" data-act="closeed" aria-label="Κλείσιμο">×</button></div>
    <div class="db">
      <div><div class="crumb" style="font-weight:600">Κατάσταση</div><div class="radio">
        <label class="${f.closed==='0'?'on':''}"><input type="radio" name="st" value="0" data-f="closed" ${f.closed==='0'?'checked':''}> Ανοιχτό</label>
        <label class="${f.closed==='1'?'on':''}"><input type="radio" name="st" value="1" data-f="closed" ${f.closed==='1'?'checked':''}> Κλειστό</label>
      </div>${f.closed===''?'<div class="mute small" style="margin-top:6px">Οι μέρες έχουν διαφορετική κατάσταση· άφησέ το έτσι για να μην αλλάξει.</div>':''}</div>
      <label class="f">${type==='room'?'Δωμάτια προς πώληση (0–11)':'Προς πώληση (0–1)'}<input class="inp num" type="number" min="0" max="${t.units}" data-f="toSell" value="${f.toSell}" placeholder="διάφορα"></label>
      <label class="f">Τιμή ανά νύχτα (€)<input class="inp num" type="number" min="0" data-f="price" value="${f.price}" placeholder="διάφορες"></label>
      <label class="f">Ελάχιστες νύχτες<input class="inp num" type="number" min="1" max="14" data-f="min" value="${f.min}" placeholder="διάφορες"></label>
      ${S.formErr?`<div class="err">${S.formErr}</div>`:''}
      <div class="info">Τα κενά πεδία μένουν όπως είναι. Οι κρατήσεις που υπάρχουν δεν επηρεάζονται.</div>
      <button class="lnk" style="align-self:flex-start" data-act="resetov">Επαναφορά στις τιμές της σεζόν</button>
    </div>
    <div class="df"><button class="btn" data-act="saveed">Αποθήκευση</button><button class="btn sec" data-act="closeed">Άκυρο</button></div>
  </aside>`;
}
function saveEditor(){
  const {type,a,z} = S.sel, t = TYPES.find(x=>x.id===type), f = S.form;
  const toSell = f.toSell===''?null:Number(f.toSell), price = f.price===''?null:Number(f.price), min = f.min===''?null:Number(f.min);
  if (toSell!=null && (toSell<0 || toSell>t.units || !Number.isInteger(toSell))) { S.formErr = 'Βάλε αριθμό από 0 έως '+t.units+'.'; return render(); }
  if (toSell!=null) for (let d=a; d<=z; d=add(d,1)) { const b = booked(type,d); if (toSell < b) { S.formErr = `Στις ${fmt(d)} έχεις ήδη ${b} κρατήσεις· δεν γίνεται λιγότερα από ${b}.`; return render(); } }
  if (price!=null && !(price>0)) { S.formErr = 'Η τιμή πρέπει να είναι πάνω από 0.'; return render(); }
  if (min!=null && !(min>=1)) { S.formErr = 'Οι ελάχιστες νύχτες πρέπει να είναι τουλάχιστον 1.'; return render(); }
  for (let d=a; d<=z; d=add(d,1)) {
    const k = type+'|'+d, o = Object.assign({}, S.ov[k]);
    if (f.closed!=='') o.closed = f.closed==='1';
    if (toSell!=null) o.toSell = toSell;
    if (price!=null) o.price = price;
    if (min!=null) o.min = min;
    S.ov[k] = o;
  }
  const n = diff(a,z)+1; S.sel = null; S.form = null;
  say(`Αποθηκεύτηκε για ${n} ${n===1?'μέρα':'μέρες'} · ${t.name}`);
}

/* ---------- RESERVATIONS ---------- */
function filteredRes(){
  const F = S.resF, q = F.q.trim().toLowerCase();
  return S.bookings.filter(b => {
    const key = F.by==='arr' ? b.start : F.by==='dep' ? end(b) : b.on;
    if (F.from && key < F.from) return false;
    if (F.to && key > F.to) return false;
    if (F.status!=='all' && b.status!==F.status) return false;
    if (F.src!=='all' && b.source!==F.src) return false;
    if (q && !(b.name.toLowerCase().includes(q) || ref(b).toLowerCase().includes(q))) return false;
    return true;
  }).sort((x,y) => ((y.status==='pending')-(x.status==='pending')) || x.start.localeCompare(y.start));
}

function downloadCsv(){
  const L = filteredRes();
  const rows = [['Αριθμός','Επισκέπτης','Άφιξη','Αναχώρηση','Νύχτες','Άτομα','Μονάδα','Κατάσταση','Πηγή','Τιμή','Προμήθεια','Κράτηση έγινε']]
    .concat(L.map(b=>[ref(b),b.name,b.start,end(b),b.nights,b.guests,b.unit?unitName(b.unit):'',b.status,b.source==='booking'?'Booking.com':'Σάιτ',b.total,commission(b).toFixed(2),b.on]));
  const csv = '﻿' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');

  say('Το αρχείο κατέβηκε (ανοίγει και στο Excel)');
}

/* ---------- FINANCE ---------- */
function vFin(){

  const sSite = site.reduce((s,b)=>s+b.total,0), sBk = bk.reduce((s,b)=>s+b.total,0);
  const comm = sBk*COMMISSION, fees = site.reduce((s,b)=>s+CARD_FEE(b.total),0);
  const saved = sSite*COMMISSION - fees;
  return head('Οικονομικά', 'Οικονομικά · Ιούλιος 2026', `<button class="btn sec" data-act="toast" data-msg="Το αρχείο για τον λογιστή θα βγαίνει σε CSV, όπως στις Κρατήσεις">Αρχείο για λογιστή</button>`) + `

    <div class="tw"><table class="t"><thead><tr><th>Χρέωση</th><th>Επισκέπτης</th><th>Διαμονή</th><th class="r">Ποσό</th><th class="r">Χρέωση κάρτας</th><th class="r">Καθαρό</th></tr></thead><tbody>
    ${site.sort((a,b)=>a.on.localeCompare(b.on)).map(b=>`<tr class="row" data-act="open" data-id="${b.id}"><td class="num">${fmtY(b.on)}</td><td>${esc(b.name)}</td><td class="num">${fmt(b.start)} – ${fmt(end(b))}</td><td class="r num">${money2(b.total)}</td><td class="r num">−${money2(CARD_FEE(b.total))}</td><td class="r num"><b>${money2(b.total-CARD_FEE(b.total))}</b></td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="3">Σύνολο</td><td class="r num">${money2(sSite)}</td><td class="r num">−${money2(fees)}</td><td class="r num">${money2(sSite-fees)}</td></tr></tfoot></table></div>

    <p style="margin:0">Το Booking στέλνει τιμολόγιο προμήθειας στις αρχές κάθε μήνα για τις αναχωρήσεις του προηγούμενου. Για τον Ιούλιο: περίπου <b>${money2(comm)}</b> από ${bk.length} κρατήσεις.</p>

/* ---------- ANALYTICS ---------- */
function vStats(){
  const days = monthDays('2026-07');
  const data = days.map(d => {
    const bs = confirmed().filter(b=>b.start<=d && d<end(b));
    return {d, site:bs.filter(b=>b.source==='site').length, bk:bs.filter(b=>b.source==='booking').length};
  });
  const L = confirmed().filter(b=>b.start.slice(0,7)==='2026-07');
  const lead = L.reduce((s,b)=>s+diff(b.on,b.start),0)/L.length;
  const los = L.reduce((s,b)=>s+b.nights,0)/L.length;
  const canc = S.bookings.filter(b=>b.status==='cancelled' && b.start.slice(0,7)==='2026-07').length;
  const cc = {}; L.forEach(b=>cc[b.cc]=(cc[b.cc]||0)+1);
  const ccs = Object.entries(cc).sort((a,b)=>b[1]-a[1]);
  return head('Analytics', 'Πώς πάει ο Ιούλιος') + `
  <div class="kpis">
    <div class="kpi"><div class="d">Μέση διαμονή</div><div class="v">${los.toFixed(1).replace('.',',')} νύχτες</div></div>
    <div class="kpi"><div class="d">Κλείνουν κατά μέσο όρο</div><div class="v">${Math.round(lead)} μέρες πριν</div></div>
    <div class="kpi"><div class="d">Ακυρώσεις</div><div class="v">${canc}</div><div class="d">από ${L.length+canc} κρατήσεις</div></div>
    <div class="kpi"><div class="d">Αιτήματα σε αναμονή</div><div class="v">${pending().length}</div></div>
  </div>
  <section class="card" style="margin-top:18px"><div class="hd"><h2>Γεμάτες μονάδες ανά μέρα</h2><div class="sp"></div>
    <span class="legend" style="margin:0"><span><i style="background:var(--site)"></i>Σάιτ</span><span><i style="background:var(--bk)"></i>Booking.com</span></span></div>
    <div class="bd"><div class="chart" role="img" aria-label="Γεμάτες μονάδες ανά μέρα τον Ιούλιο">${data.map(x=>`<div class="c" title="${fmt(x.d)}: ${x.site+x.bk} από 12 (σάιτ ${x.site}, Booking ${x.bk})"><i style="height:${x.bk/12*100}%;background:var(--bk)"></i><i style="height:${x.site/12*100}%;background:var(--site)"></i></div>`).join('')}</div>
    <div class="axis">${data.map(x=>`<span>${dt(x.d).getUTCDate()%5===1||x.d===TODAY?dt(x.d).getUTCDate():''}</span>`).join('')}</div>
    <div class="mute small" style="margin-top:6px">Ύψος = 12 μονάδες (11 δωμάτια + διαμέρισμα)</div></div>
  </section>
  <section class="card" style="margin-top:18px"><div class="hd"><h2>Από πού έρχονται</h2></div><div class="bd"><div class="bars">${ccs.map(([c,n])=>`<div class="bar"><div class="l"><span>${c}</span><b>${n}</b></div><div class="tr"><i style="width:${n/ccs[0][1]*100}%"></i></div></div>`).join('')}</div></div></section>`;
}

/* ---------- render ---------- */
const VIEWS = {home:vHome, cal:vCal, seasons:vSeasons, res:vRes, propinfo:vPropInfo, photos:vPhotos, inbox:vInbox, reviews:vReviews, fin:vFin, stats:vStats};
function render(){
  const sc = document.getElementById('calScroll'); const sl = sc ? sc.scrollLeft : null;
  renderNav();
  document.getElementById('view').innerHTML = VIEWS[S.page]();
  let layer = '';
  if (S.detail) layer = vDetail();
  else if (S.sel && S.form) layer = vEditor();
  if (S.toast) layer += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  document.getElementById('layer').innerHTML = layer;
  const sc2 = document.getElementById('calScroll');
  if (sc2) { if (sl!=null && S._keepScroll) sc2.scrollLeft = sl; else if (S.calMonth===TODAY.slice(0,7)) { const th = sc2.querySelector('th.today'); if (th) sc2.scrollLeft = 0; sc2.scrollLeft = Math.max(0, th.getBoundingClientRect().left - sc2.getBoundingClientRect().left - sc2.querySelector('th.lab').offsetWidth - th.offsetWidth); } }
  S._keepScroll = false;
  const ms = document.getElementById('msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  document.body.style.overflow = (S.detail || S.form) ? 'hidden' : '';
}
let tT;
function say(msg){ S.toast = msg; render(); clearTimeout(tT); tT = setTimeout(()=>{ S.toast=null; render(); }, 3200); }
function go(id){
  S.page = id; S.detail = null; S.sel = null; S.form = null; S.replyOpen = null; closeMenu();
  history.replaceState(null,'','#'+id); render(); window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#dd')) closeMenu(); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (a!=='menu') closeMenu();
  switch (a) {
    case 'menu': openMenu(el, id); break;
    case 'go': go(id); break;
    case 'toast': say(el.dataset.msg); break;
    case 'htab': S.homeTab = el.dataset.k; render(); break;
    case 'hday': S.homeDay = el.dataset.d; render(); break;
    case 'res-pending': S.resF = Object.assign({}, S.resF, {status:'pending', from:'', to:''}); go('res'); break;
    case 'open': S.detail = id; render(); break;
    case 'closedet': S.detail = null; render(); break;
    case 'thread': { const t = S.threads.find(x=>x.id===id); t.unread = false; S.thread = id; if (S.page!=='inbox') go('inbox'); else render(); break; }
    case 'msgguest': { let t = S.threads.find(x=>x.bid===id); if (!t) { t = {id:'t'+(S.threads.length+1)+'x', bid:id, unread:false, msgs:[]}; S.threads.unshift(t); } S.thread = t.id; go('inbox'); break; }
    case 'quick': { const r = document.getElementById('reply'); r.value = QUICK[+el.dataset.i][1]; r.focus(); break; }
    case 'send': { const r = document.getElementById('reply'); const v = r.value.trim(); if (!v) { r.focus(); return; } const t = S.threads.find(x=>x.id===S.thread)||S.threads[0]; t.msgs.push({from:'host', t:'14 Ιουλ '+new Date().toTimeString().slice(0,5), text:v}); t.unread = false; say('Το μήνυμα στάλθηκε'); break; }
    case 'accept': {
      const b = byId(id); const sel = document.querySelector(`[data-pick="${id}"]`); const u = sel ? sel.value : null;
      if (!u || !isFree(u, b.start, b.nights)) { say('Αυτή η μονάδα δεν είναι πια ελεύθερη'); return; }
      b.status = 'confirmed'; b.unit = u; delete b.ago; S.detail = null;
      say(`Επιβεβαιώθηκε · ${unitName(u)} για ${b.name}. Χρεώθηκε η κάρτα και έκλεισαν οι μέρες στο Booking.com.`); break;
    }
    case 'decline': { const b = byId(id); if (!confirm(`Απόρριψη του αιτήματος από ${b.name}; Η κάρτα δεν χρεώνεται.`)) return; b.status = 'cancelled'; b.cancelledOn = TODAY; delete b.ago; S.detail = null; say('Το αίτημα απορρίφθηκε. Ο επισκέπτης ενημερώθηκε με email.'); break; }
    case 'cancel': { const b = byId(id); if (!confirm(`Ακύρωση της κράτησης του ${b.name} και επιστροφή ${money(b.total)};`)) return; b.status = 'cancelled'; b.cancelledOn = TODAY; S.detail = null; say('Ακυρώθηκε. Η επιστροφή χρημάτων ξεκίνησε και οι μέρες άνοιξαν ξανά.'); break; }
    case 'cm': S.calMonth = shiftMonth(S.calMonth, +el.dataset.k); S.sel = null; render(); break;
    case 'cmtoday': S.calMonth = TODAY.slice(0,7); render(); break;
    case 'bulk': { const ds = monthDays(S.calMonth); const a0 = ds[0] < TODAY ? TODAY : ds[0]; openEditor('room', a0, ds[ds.length-1] < a0 ? a0 : ds[ds.length-1]); break; }
    case 'qtoggle': {
      e.stopPropagation(); const [t,d] = el.dataset.k.split('|'); const r = day(t,d);
      S.ov[t+'|'+d] = Object.assign({}, S.ov[t+'|'+d], {closed: !r.closed}); S._keepScroll = true;
      say(`${TYPES.find(x=>x.id===t).name} · ${fmtD(d)}: ${r.closed?'άνοιξε':'έκλεισε'}`); break;
    }
    case 'closeed': S.sel = null; S.form = null; S._keepScroll = true; render(); break;
    case 'saveed': S._keepScroll = true; saveEditor(); break;
    case 'resetov': { const {type,a:x,z} = S.sel; for (let d=x; d<=z; d=add(d,1)) delete S.ov[type+'|'+d]; S.sel=null; S.form=null; S._keepScroll = true; say('Επανήλθαν οι τιμές της σεζόν'); break; }
    case 'csv': downloadCsv(); break;
    case 'rvopen': S.replyOpen = id || null; render(); if (id) { const t = document.getElementById('rv-'+id); t && t.focus(); } break;
    case 'rvsave': { const t = document.getElementById('rv-'+id); const v = t.value.trim(); if (!v) { t.focus(); return; } S.reviews.find(r=>r.id===id).reply = v; S.replyOpen = null; say('Η απάντηση δημοσιεύτηκε'); break; }
    case 'saveprop': say('Τα στοιχεία αποθηκεύτηκαν'); break;
    case 'saveseasons': say('Οι τιμές σεζόν αποθηκεύτηκαν'); break;
    case 'phmv': { const i = +el.dataset.i, j = i + (+el.dataset.k); [S.photos[i], S.photos[j]] = [S.photos[j], S.photos[i]]; render(); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.detail) { S.detail=null; render(); } else if (S.form) { S.sel=null; S.form=null; S._keepScroll=true; render(); } closeMenu(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.th[data-act]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('scroll', closeMenu, {passive:true});
window.addEventListener('resize', closeMenu);

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.rf) { S.resF[t.dataset.rf] = t.value; const box = document.getElementById('resTable'); if (box) box.innerHTML = vResTable(); }
  else if (t.dataset.f && t.type !== 'radio') S.form[t.dataset.f] = t.value;
  else if (t.dataset.pf) S.prop[t.dataset.pf] = t.value;
  else if (t.dataset.se) { const [id,k] = t.dataset.se.split('|'); const v = Number(t.value); if (v > 0) S.seasons.find(s=>s.id===id)[k] = v; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && t.type === 'radio') { S.form.closed = t.value; S._keepScroll = true; render(); }
  else if (t.dataset.pick) S.pick[t.dataset.pick] = t.value;
  else if (t.dataset.move) { const b = byId(t.dataset.move); b.unit = t.value; say(`${b.name} → ${unitName(t.value)}`); }
  else if (t.dataset.am) S.prop.amen[t.dataset.am] = t.checked ? 1 : 0;
});

/* drag-select on the calendar */
let drag = null;
document.addEventListener('pointerdown', e => {
  const td = e.target.closest('td[data-cell]');
  if (!td || e.target.closest('button') || e.button !== 0) return;
  const [type, d] = td.dataset.cell.split('|');
  drag = {type, a:d, z:d};
  paintSel();
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const td = el && el.closest('td[data-cell]');
  if (!td) return;
  const [type, d] = td.dataset.cell.split('|');
  if (type === drag.type && d !== drag.z) { drag.z = d; paintSel(); }
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const {type, a, z} = drag; drag = null; S._keepScroll = true;
  openEditor(type, a, z);
});
function paintSel(){
  const lo = drag.a < drag.z ? drag.a : drag.z, hi = drag.a < drag.z ? drag.z : drag.a;
  document.querySelectorAll('td[data-cell]').forEach(td => {
    const [t,d] = td.dataset.cell.split('|');
    td.classList.toggle('selc', t===drag.type && d>=lo && d<=hi);
  });
}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== S.page) go(h); });
const start = location.hash.slice(1);
if (VIEWS[start]) S.page = start;
render();
</script>
</body>
